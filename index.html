<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bible Adventure — The Covenant Nation Lekki</title>
<style>
  :root{
    --purple:#6B3FA0; --purple-dark:#4B2470; --gold:#F0B429; --gold-dark:#C98A0C;
    --green:#1E8A4C; --green-light:#E6F6EC; --cream:#FFFBF0; --paper:#FFF6E0;
    --ink:#2E2145; --muted:#6B6178; --white:#FFFFFF; --red:#D14343; --blue:#2E6FB0;
    --border:#EBD9A8;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Segoe UI',Arial,Helvetica,sans-serif;background:var(--cream);color:var(--ink)}
  button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  .app{display:flex;min-height:100vh}
  aside{width:230px;background:linear-gradient(180deg,var(--purple),var(--purple-dark));color:white;
    padding:22px 14px;position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;z-index:5;overflow-y:auto}
  .logo{font-size:21px;font-weight:800;line-height:1.15;margin:0 8px 26px}
  .logo span{display:block;color:var(--gold);font-size:12px;margin-top:6px;font-weight:600}
  nav{display:flex;flex-direction:column;gap:3px}
  nav button{width:100%;border:0;background:transparent;color:white;text-align:left;
    padding:12px 13px;border-radius:12px;font-size:14.5px;cursor:pointer;display:flex;gap:10px;align-items:center;font-family:inherit}
  nav button:hover,nav button.active{background:rgba(255,255,255,.18)}
  .navicon{font-size:18px;width:20px;text-align:center}
  .sidebar-foot{margin-top:auto;font-size:11.5px;color:#D9C7F0;padding:8px;line-height:1.5}
  main{margin-left:230px;width:calc(100% - 230px);padding:26px 30px 60px;max-width:1200px}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:12px;flex-wrap:wrap}
  .pill{background:var(--green-light);color:var(--green);font-weight:700;padding:7px 13px;border-radius:30px;font-size:12.5px}
  h1{font-size:27px;margin:0 0 6px;color:var(--purple-dark)}
  h2{font-size:19px;margin:0 0 10px;color:var(--purple-dark)}
  h3{margin:0 0 6px;color:var(--purple-dark);font-size:15.5px}
  p{line-height:1.55}
  .muted{color:var(--muted);font-size:12.5px}
  .screen{display:none}.screen.active{display:block}
  .hero{background:linear-gradient(135deg,#FFF3D6,#F3E9FF);border:1px solid var(--border);border-radius:22px;
    padding:26px;display:grid;grid-template-columns:1.5fr 1fr;gap:20px;align-items:center;position:relative;overflow:hidden}
  .hero-emoji{font-size:64px;text-align:center}
  .hero-thumb{width:100%;height:150px;object-fit:cover;border-radius:16px;border:2px solid rgba(255,255,255,.7)}
  .tag{display:inline-block;padding:5px 11px;border-radius:20px;background:#F0E4FF;color:var(--purple);
    font-size:11.5px;font-weight:800;letter-spacing:.4px;margin-right:6px}
  .hero-title{font-size:30px;font-weight:900;color:var(--purple-dark);margin:8px 0 6px}
  .hero-sub{font-size:14.5px;color:var(--muted);margin-bottom:10px}
  .btn{border:0;border-radius:12px;padding:11px 18px;font-weight:800;cursor:pointer;background:var(--purple);
    color:white;font-size:14px;font-family:inherit}
  .btn:hover{background:var(--purple-dark)}
  .btn.secondary{background:white;color:var(--purple);border:1.5px solid #D8C4EE}
  .btn.green{background:var(--green)}
  .btn.gold{background:var(--gold);color:var(--purple-dark)}
  .btn.danger{background:#fff;color:var(--red);border:1.5px solid #F3C2C2}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .grid{display:grid;gap:14px;margin-top:16px}
  .grid4{grid-template-columns:repeat(4,1fr)}
  .grid3{grid-template-columns:repeat(3,1fr)}
  .grid2{grid-template-columns:repeat(2,1fr)}
  .card{background:white;border:1px solid var(--border);border-radius:16px;padding:17px;box-shadow:0 2px 10px rgba(60,30,90,.05)}
  .stat{font-size:25px;font-weight:900;color:var(--purple)}
  .icon{font-size:26px;margin-bottom:6px}
  .progress{height:9px;background:#F0E9DA;border-radius:20px;overflow:hidden;margin:8px 0}
  .progress>div{height:100%;background:var(--gold)}
  .lesson-card{background:white;border:1px solid var(--border);border-radius:18px;padding:20px}
  .smallcard{padding:14px;border-radius:14px;background:var(--paper);border:1px solid var(--border)}
  .week-card{background:white;border:1px solid var(--border);border-radius:16px;padding:16px;cursor:pointer;transition:.15s;text-align:left;font-family:inherit;width:100%}
  .week-card:hover{border-color:var(--purple);box-shadow:0 3px 12px rgba(107,63,160,.12)}
  .week-card .wk-tag{font-size:11px;color:var(--gold-dark);font-weight:800;letter-spacing:.4px}
  .week-thumb{width:100%;height:96px;object-fit:cover;border-radius:12px;margin-bottom:10px;border:1px solid var(--border)}
  .lesson-banner{position:relative;border-radius:20px;overflow:hidden;margin-bottom:16px;min-height:210px;
    display:flex;align-items:flex-end;background:linear-gradient(135deg,#FFF3D6,#F3E9FF)}
  .lesson-banner .banner-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .lesson-banner .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(46,33,69,.15) 0%,rgba(46,33,69,.55) 55%,rgba(46,33,69,.85) 100%)}
  .lesson-banner .banner-text{position:relative;padding:22px;color:#fff;max-width:760px}
  .lesson-banner .banner-text h2{color:#fff;font-size:26px;margin:6px 0 4px;text-shadow:0 2px 12px rgba(0,0,0,.45)}
  .lesson-banner .banner-text p{margin:0;color:#F3E9FF;font-size:14px;text-shadow:0 1px 8px rgba(0,0,0,.5)}
  .lesson-banner .tag{background:rgba(255,255,255,.92)}
  .lesson-banner.no-image{min-height:0}
  .lesson-banner.no-image .scrim{background:none}
  .lesson-banner.no-image .banner-text{color:var(--ink)}
  .lesson-banner.no-image .banner-text h2{color:var(--purple-dark);text-shadow:none}
  .lesson-banner.no-image .banner-text p{color:var(--muted);text-shadow:none}
  .activity-wrap{position:relative;border-radius:18px;overflow:hidden;padding:2px}
  .activity-bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.10;pointer-events:none;filter:saturate(.85)}
  .activity-wrap>*:not(.activity-bg){position:relative}
  .activity-box{min-height:280px;background:rgba(255,255,255,.93);backdrop-filter:blur(1px)}
  .activity-nav{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
  .activity-nav button{border:1.5px solid #D8C4EE;background:white;color:var(--purple);border-radius:11px;
    padding:9px 13px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
  .activity-nav button.active,.activity-nav button:hover{background:var(--purple);color:white;border-color:var(--purple)}
  /* ---- Bible Jigsaw ---- */
  .jig-controls{display:grid;gap:8px;margin:8px 0 4px}
  .jig-slider{max-width:480px}
  .jig-slider input[type=range]{width:100%;accent-color:var(--purple);margin:6px 0 0}
  .jig-slider input[type=range]:disabled{opacity:.45;cursor:not-allowed}
  .jig-ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-weight:800;padding:0 2px}
  .jig-lock{font-size:13px;font-weight:700;color:var(--purple-dark);background:#F3E9FF;border-radius:10px;padding:8px 12px;max-width:640px}
  .jig-stage{background:#F6EFFC;border:2px dashed #D8C4EE;border-radius:16px;padding:6px;line-height:0;margin-top:6px}
  .jig-stage svg{width:100%;height:auto;max-height:78vh;touch-action:none;user-select:none;-webkit-user-select:none;display:block}
  .jp.loose{cursor:grab}
  .jp.drag{cursor:grabbing;filter:drop-shadow(3px 6px 5px rgba(0,0,0,.4))}
  .jp.dim{opacity:.2}
  .jp.snap{animation:jpSnap .4s}
  @keyframes jpSnap{0%{filter:brightness(1.7)}100%{filter:none}}
  .jig-stage.complete .jp path,.jig-stage.complete .jig-guide{stroke-opacity:0;transition:stroke-opacity .8s}
  .jig-win{background:var(--green-light);border:2px solid var(--green);border-radius:14px;padding:12px 16px;margin:12px 0;font-weight:800;color:#14663A;line-height:1.4}
  .question{font-size:19px;font-weight:800;margin:10px 0 16px;color:var(--purple-dark)}
  .options{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
  .option{padding:14px;background:var(--paper);border:2px solid var(--border);border-radius:13px;cursor:pointer;
    font-weight:700;font-size:14px;font-family:inherit;text-align:left;width:100%;color:var(--ink)}
  .option:hover{border-color:var(--purple);background:#F3E9FF}
  .option.correct{background:var(--green-light);border-color:var(--green);color:var(--green)}
  .option.wrong{background:#FDEBEB;border-color:var(--red);color:var(--red)}
  .feedback{margin-top:14px;font-weight:800;min-height:22px;font-size:14.5px}
  .grid-scroll{overflow-x:auto;padding-bottom:6px}
  .word-grid{display:grid;gap:3px;justify-content:center;margin:16px auto;user-select:none;width:max-content}
  .letter{border:1px solid #E5D9BC;border-radius:6px;display:flex;align-items:center;justify-content:center;
    font-weight:800;background:#fff;cursor:pointer;font-size:13.5px;font-family:inherit;padding:0}
  .letter.sel{background:#F0E4FF;border-color:var(--purple)}
  .letter.found{background:var(--green-light);border-color:var(--green);color:var(--green)}
  .wordlist{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .wordlist span{padding:5px 11px;border-radius:20px;background:var(--paper);border:1px solid var(--border);font-size:12.5px;font-weight:700}
  .wordlist span.done{background:var(--green-light);color:var(--green);border-color:var(--green);text-decoration:line-through}
  .verse-bank{display:flex;flex-wrap:wrap;gap:9px;margin:14px 0;min-height:46px;padding:10px;background:var(--paper);border-radius:12px;border:1px dashed var(--border)}
  .verse-answer{display:flex;flex-wrap:wrap;gap:9px;min-height:46px;padding:10px;background:#fff;border:2px solid var(--border);border-radius:12px;margin-bottom:10px}
  .vchip{padding:8px 13px;background:white;border:1.5px solid #D8C4EE;border-radius:9px;cursor:pointer;font-weight:700;font-size:13.5px;font-family:inherit}
  .vchip:hover{background:#F3E9FF}
  table{width:100%;border-collapse:collapse;background:white;border-radius:14px;overflow:hidden;font-size:13px}
  th,td{padding:10px 11px;border-bottom:1px solid #F0E9DA;text-align:left}
  th{background:var(--paper);color:var(--purple-dark)}
  .table-scroll{overflow-x:auto}
  .input,textarea.input,select.input{padding:10px;border:1.5px solid #D8C4EE;border-radius:9px;width:100%;font-family:inherit;font-size:13.5px;background:#fff}
  textarea.input{resize:vertical}
  label.field{display:block;font-size:12.5px;font-weight:700;color:var(--purple-dark);margin:10px 0 4px}
  .badge{width:118px;text-align:center;padding:14px 8px;border-radius:16px;background:#FFF6DB;border:1px solid #F0D27B}
  .badge.locked{opacity:.4}
  .badge .big{font-size:34px}
  .badge-row{display:flex;gap:13px;flex-wrap:wrap}
  .badge.tier{width:66px;padding:9px 4px;border-radius:13px}
  .badge.tier .big{font-size:21px}
  .badge.tier .tier-label{display:block;font-size:9.5px;font-weight:800;color:var(--purple-dark);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .badge-family{margin-bottom:16px}
  .badge-family-head{display:flex;align-items:center;gap:12px}
  .badge-family-head .big{font-size:38px}
  .badge-family-head strong{font-size:15px}
  .leader-row{display:flex;align-items:center;gap:14px;background:white;border:1px solid var(--border);border-radius:14px;padding:12px 16px;margin-bottom:10px}
  .leader-row.rank-1{border-color:#F0D27B;background:#FFFBEF}
  .leader-rank{font-size:22px;font-weight:900;color:var(--purple-dark);width:34px;text-align:center;flex-shrink:0}
  .leader-name{font-weight:800;font-size:14.5px}
  .leader-points{margin-left:auto;font-weight:800;color:var(--purple-dark);white-space:nowrap}
  .reading-item{display:flex;align-items:center;gap:14px;background:white;border:1px solid var(--border);border-radius:14px;padding:12px 16px;margin-bottom:10px;font-weight:700;line-height:1.4}
  .reading-num{width:30px;height:30px;border-radius:50%;background:var(--purple);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex-shrink:0}
  .banner{padding:12px 16px;border-radius:12px;font-weight:700;font-size:13.5px;margin-bottom:14px}
  .banner.warn{background:#FFF3D6;color:#8A5A00;border:1px solid #F0D27B}
  .banner.ok{background:var(--green-light);color:var(--green);border:1px solid #B7E3C6}
  .banner.bad{background:#FDEBEB;color:#A32B2B;border:1px solid #F3C2C2}
  .toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:12px 0}
  /* Archives: theme tabs (level 1) and lesson tabs inside a theme (level 2) */
  .theme-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 6px;padding-bottom:12px;border-bottom:2px solid var(--border)}
  .theme-tab{border:2px solid var(--gold);background:var(--paper);color:var(--purple-dark);border-radius:14px;padding:9px 15px;
    font-weight:800;font-size:14px;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:8px;text-align:left}
  .theme-tab small{background:white;color:var(--muted);border-radius:20px;padding:2px 8px;font-size:11.5px;font-weight:700}
  .theme-tab:hover{background:#FFEBB8}
  .theme-tab.active{background:var(--purple);border-color:var(--purple);color:white}
  .theme-tab.active small{background:rgba(255,255,255,.9);color:var(--purple)}
  .theme-sub{margin:14px 0 2px;font-size:13px;color:var(--muted);font-weight:700}
  .lesson-tab-topic{display:block;font-size:11.5px;font-weight:600;opacity:.85;margin-top:2px}
  .character-clue{background:var(--paper);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:14px}
  .treasure-row{display:flex;align-items:center;gap:14px;background:white;border:1px solid var(--border);border-radius:14px;padding:12px 16px;margin-bottom:10px}
  .treasure-choice{flex:1;padding:11px;border-radius:11px;border:2px solid var(--border);cursor:pointer;text-align:center;font-weight:700;font-size:13.5px;font-family:inherit;background:#fff;color:var(--ink)}
  .treasure-choice:hover{border-color:var(--purple)}
  .treasure-choice.correct{background:var(--green-light);border-color:var(--green);color:var(--green)}
  .treasure-choice.wrong{background:#FDEBEB;border-color:var(--red);color:var(--red)}
  .footer-note{margin-top:16px;color:var(--muted);font-size:12px;line-height:1.6}
  .modal-overlay{position:fixed;inset:0;background:rgba(46,33,69,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
  .modal-overlay.hidden{display:none}
  .modal-card{background:var(--cream);border-radius:22px;padding:30px;max-width:480px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.25);max-height:88vh;overflow:auto}
  .modal-card h2{font-size:23px;margin-bottom:4px}
  .age-options{display:flex;flex-direction:column;gap:10px;margin:16px 0}
  .age-btn{display:flex;align-items:center;gap:12px;padding:13px 15px;border-radius:14px;border:2px solid var(--border);background:white;cursor:pointer;text-align:left;font-family:inherit;width:100%}
  .age-btn:hover{border-color:var(--purple)}
  .age-btn.selected{border-color:var(--purple);background:#F3E9FF}
  .age-btn .ab-emoji{font-size:26px}
  .age-btn .ab-label{font-weight:800;color:var(--purple-dark);font-size:14.5px}
  .age-btn .ab-range{font-size:12px;color:var(--muted)}
  .profile-row{display:flex;gap:8px;align-items:center}
  .profile-row .age-btn{flex:1}
  .mini-btn{border:1.5px solid #D8C4EE;background:#fff;border-radius:10px;padding:9px 10px;cursor:pointer;font-family:inherit;font-size:13px}
  .profile-chip{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);border-radius:12px;padding:9px 11px;margin-bottom:14px;cursor:pointer;font-size:12.5px;border:0;color:#fff;font-family:inherit;width:100%;text-align:left}
  .profile-chip:hover{background:rgba(255,255,255,.22)}
  .profile-chip .pc-emoji{font-size:20px}
  .sheep-count{font-size:30px;letter-spacing:4px;line-height:1.5;background:var(--paper);border:1px solid var(--border);border-radius:14px;padding:16px;text-align:center;margin:14px 0}
  .reflect-box{width:100%;min-height:90px;padding:12px;border:1.5px solid #D8C4EE;border-radius:11px;font-family:inherit;font-size:13.5px}
  .teacher-nav{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px;padding:8px;background:white;border:1px solid var(--border);border-radius:16px;position:sticky;top:8px;z-index:5;box-shadow:0 5px 18px rgba(46,33,69,.06)}
  .teacher-nav button{border:0;background:transparent;padding:10px 13px;border-radius:11px;font-family:inherit;font-weight:800;color:var(--purple-dark);cursor:pointer}
  .teacher-nav button.selected,.teacher-nav button:hover{background:#F3E9FF;color:var(--purple)}
  .teacher-nav .spacer{flex:1}
  .teacher-hero{display:flex;justify-content:space-between;align-items:center;gap:20px;background:linear-gradient(135deg,#FFF8E8,#F4ECFF);border:1px solid var(--border);border-radius:22px;padding:24px;margin-bottom:18px}
  .teacher-hero h1{margin:2px 0 6px}.teacher-hero p{margin:0;color:var(--muted)}.teacher-hero-icon{font-size:58px}
  .section-head{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;margin-bottom:15px}
  .section-head h1,.section-head h2{margin:0 0 4px}
  .action-card{min-height:155px}.action-card p{color:var(--muted);min-height:42px}
  .status{display:inline-block;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:900}
  .status-live{background:#E6F6EC;color:#187A3D}.status-review{background:#FFF3D6;color:#8A5A00}.status-draft{background:#F0E9F8;color:#6D4AA5}
  .img-drop{border:2px dashed #D8C4EE;border-radius:16px;padding:18px;text-align:center;background:#FCF9FF}
  .img-preview{width:100%;max-height:230px;object-fit:cover;border-radius:14px;border:1px solid var(--border)}
  .img-meta{font-size:12px;color:var(--muted);margin-top:8px}
  .login-wrap{max-width:420px;margin:40px auto;text-align:center}
  .login-card{background:white;border:1px solid var(--border);border-radius:22px;padding:30px;box-shadow:0 8px 30px rgba(60,30,90,.08);text-align:left}
  .login-card h1{text-align:center}
  .pin-input{font-size:28px;letter-spacing:14px;text-align:center;padding:12px;width:100%;border:2px solid #D8C4EE;border-radius:14px;font-family:inherit;background:#fff}
  .pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}
  .pinpad button{padding:15px 0;font-size:19px;font-weight:800;border:1.5px solid #D8C4EE;background:#fff;border-radius:13px;cursor:pointer;font-family:inherit;color:var(--purple-dark)}
  .pinpad button:hover{background:#F3E9FF}
  .config-banner{max-width:640px;margin:40px auto;text-align:left}
  @media(max-width:880px){
    aside{width:64px;padding:16px 8px}.logo{font-size:0;text-align:center}.logo:before{content:"🐑";font-size:24px}
    .logo span{display:none}nav button{font-size:0;justify-content:center;padding:12px 6px}
    .navlabel{display:none}.sidebar-foot{display:none}
    .profile-chip{justify-content:center;padding:9px 4px}.profile-chip span:not(.pc-emoji){display:none}
    main{margin-left:64px;width:calc(100% - 64px);padding:16px}
    .hero{grid-template-columns:1fr}.grid4{grid-template-columns:repeat(2,1fr)}
    .grid3{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}.options{grid-template-columns:1fr}
    .lesson-banner .banner-text h2{font-size:21px}
  }
  @media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

  /* ---- Crossword ---- */
  .cw-layout{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:start;margin-top:10px}
  .cw-grid{display:grid;gap:2px;width:max-content;user-select:none;margin:6px 0}
  .cw-blank{width:var(--cw);height:var(--cw)}
  .cw-cell{position:relative;width:var(--cw);height:var(--cw);background:#fff;border:1.5px solid #B9A7D6;border-radius:5px}
  .cw-cell input{width:100%;height:100%;border:0;background:transparent;text-align:center;font-weight:800;
    font-size:calc(var(--cw)*.5);text-transform:uppercase;padding:calc(var(--cw)*.16) 0 0;color:var(--ink);
    font-family:inherit;border-radius:5px;caret-color:transparent;cursor:pointer}
  .cw-cell.cw-word{background:#F3E9FF}

<script type="module">
/* =====================================================================
   FIREBASE SETUP — paste your project's config below.
   Firebase console → Project settings → General → Your apps → Web app.
   See SETUP.md for the full step-by-step guide (free tier is enough
   for a Sunday School's worth of children).
   ===================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyDElW453fmp8EiTDL2rkx9yJE4_7DQriWg",
  authDomain: "tcn-bible-adventure.firebaseapp.com",
  projectId: "tcn-bible-adventure",
  storageBucket: "tcn-bible-adventure.firebasestorage.app",
  messagingSenderId: "195171000964",
  appId: "1:195171000964:web:09ade44f8d3f49fc3e18d1"
};

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import {
  getFirestore, doc, getDoc, getDocs, setDoc, addDoc, updateDoc, deleteDoc,
  collection, onSnapshot, query, orderBy, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
import {
  getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut,
  EmailAuthProvider, reauthenticateWithCredential, updatePassword
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

let db=null, auth=null, dbReady=false;
const isPlaceholder = !firebaseConfig.apiKey || firebaseConfig.apiKey.startsWith('YOUR_');
if(!isPlaceholder){
  try{
    const fbApp = initializeApp(firebaseConfig);
    db = getFirestore(fbApp);
    auth = getAuth(fbApp);
    dbReady = true;
  }catch(e){ console.error('Firebase init failed', e); }
}
if(!dbReady){
  document.getElementById('configScreen').style.display='block';
  document.getElementById('configScreen').innerHTML = `
    <div class="login-card">
      <h1>⚙️ Firebase not configured yet</h1>
      <p>This copy of Bible Adventure hasn't been connected to a Firebase project, so it can't
      share lessons or children's progress across devices yet.</p>
      <p class="muted">Open this file, find the <code>firebaseConfig</code> object near the top of the
      script, and paste in your project's web app config. Full steps are in <code>SETUP.md</code>,
      which was delivered alongside this file.</p>
    </div>`;
} else {
  document.getElementById('appRoot').style.display='flex';
}

/* Expose the functions the inline onclick="" handlers in the HTML call. */
const api = {};
window.addEventListener('DOMContentLoaded', ()=>{ boot(); });

/* ===================== CONSTANTS ===================== */
const AGE_GROUPS = {
  '3-5':  {label:'Little Lambs', range:'Ages 3–5',  emoji:'🐣'},
  '6-9':  {label:'Explorers',    range:'Ages 6–9',  emoji:'🐑'},
  '10-12':{label:'Voyagers',     range:'Ages 10–12',emoji:'🦁'}
};
const BLANK_PROGRESS = {completed:{}, scores:{}, playCounts:{}, points:0, whoAmICorrect:0, whoAmIByLesson:{}, lastActive:null};
const MAX_LESSON_DOC_BYTES = 900000; // stay safely under Firestore's 1 MiB document limit

/* ===================== STATE ===================== */
let STATE = { lessons: [], challenges: [] };
let leaderboardTab = 'week';
let PROFILES = [];
let currentLessonId = null;
let currentActivity = 'quiz';
let renderToken = 0;
let teacherUnlocked = false;
let teacherEmail = '';
let PROGRESS = normalizeProgress({});
let activeProfileId = null;
try{ activeProfileId = localStorage.getItem('bibleAdventureActiveId') || null; }catch(e){}

function normalizeProgress(p){
  const out = Object.assign({}, BLANK_PROGRESS, p||{});
  // Always hand back fresh nested objects: reusing BLANK_PROGRESS's own
  // {} objects would let one child's (or a signed-out visitor's) activity
  // leak into every other blank record.
  out.completed = (p && p.completed) || {};
  out.scores = (p && p.scores) || {};
  out.playCounts = (p && p.playCounts) || {};
  out.whoAmIByLesson = (p && p.whoAmIByLesson) || {};
  out.points = Number(out.points)||0;
  // Weekly Challenge points live in their own bucket so they can never mix
  // with Adventure Points, badges or the lesson leaderboards.
  const ch = (p && p.challenge) || {};
  out.challenge = {scores: ch.scores||{}, playCounts: ch.playCounts||{}, points: Number(ch.points)||0, lastActive: ch.lastActive||null};
  return out;
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
async function sha256(text){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
function setSyncPill(state){
  const el = document.getElementById('syncPill'); if(!el) return;
  if(state==='ok'){ el.textContent='☁️ Synced'; el.style.background='#E6F6EC'; el.style.color='#1E8A4C'; }
  else if(state==='offline'){ el.textContent='⚠️ Offline — saved on this device'; el.style.background='#FFF3D6'; el.style.color='#8A5A00'; }
  else { el.textContent='🔄 Connecting…'; el.style.background='#F0E9F8'; el.style.color='#6D4AA5'; }
}

/* ===================== FIRESTORE: LESSONS (live) ===================== */
function watchLessons(){
  if(!dbReady) return;
  const q = query(collection(db,'lessons'), orderBy('seq'));
  onSnapshot(q, snap=>{
    const prevCurId = (pickCurrentLesson()||{}).id;   // the lesson that was "current" before this update
    const everything = snap.docs.map(d=>({id:d.id, ...d.data()}));
    // Weekly challenges share the lessons collection (so no new Firestore
    // rules are needed) but are kept out of every lesson list.
    STATE.lessons = everything.filter(x=>x.kind!=='challenge');
    STATE.challenges = everything.filter(x=>x.kind==='challenge');
    setSyncPill('ok');
    const current = currentLessonId ? STATE.lessons.find(l=>l.id===currentLessonId) : null;
    const currentIsPublished = current && (current.status||'Published')==='Published';
    // If a child was on the current lesson and a newer one has just arrived, move them to the new one.
    if(!teacherPreviewMode && currentLessonId && currentLessonId===prevCurId){
      const nc = pickCurrentLesson(); if(nc) currentLessonId = nc.id;
    }
    // A teacher previewing a Draft/Review lesson is allowed to keep viewing
    // it — only a child's own browsing gets swapped off a deactivated lesson.
    if(!currentLessonId || (!currentIsPublished && !teacherPreviewMode)){
      const pick = pickCurrentLesson();
      currentLessonId = pick ? pick.id : null;
    }
    // Never force-refresh an open lesson editor: a background lesson update
    // (including the teacher's own in-flight publish) would otherwise wipe
    // out characters, quiz JSON and other fields the teacher hasn't saved yet.
    if(isEditingLessonScreen()) return;
    refreshCurrentScreen();
  }, err=>{ console.error(err); setSyncPill('offline'); });
}
function isEditingLessonScreen(){
  const teacherScreen = document.getElementById('teacher');
  return !!(teacherScreen && teacherScreen.classList.contains('active') && (teacherSection==='editor' || teacherSection==='challengeEditor'));
}
function getLesson(id){ return STATE.lessons.find(l=>l.id===id) || STATE.lessons[0] || null; }
// Lessons children may browse/play. "Published" is the on position of the
// teacher's activate/deactivate switch; Draft and Review are both off.
function publishedLessons(){ return STATE.lessons.filter(l=>(l.status||'Published')==='Published'); }
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const WEEKDAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
// Reads "Sunday, 8 November 2026", "8 November 2026", "2026-11-08" and similar. Returns a timestamp, or null if unreadable.
function parseLessonDate(s){
  const str=String(s||'').trim(); if(!str) return null;
  let m=str.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(m) return new Date(+m[1],+m[2]-1,+m[3]).getTime();
  const clean=str.replace(/^(mon|tue|wed|thu|fri|sat|sun)[a-z]*\.?,?\s+/i,'');
  m=clean.match(/^(\d{1,2})(?:st|nd|rd|th)?\s+([A-Za-z]+)\.?,?\s+(\d{4})$/);
  if(m){ const mi=MONTHS.findIndex(x=>x.toLowerCase().startsWith(m[2].toLowerCase().slice(0,3))); if(mi>=0) return new Date(+m[3],mi,+m[1]).getTime(); }
  const t=Date.parse(clean); return isNaN(t)?null:t;
}
function formatLessonDate(ts){ const d=new Date(ts); return WEEKDAYS[d.getDay()]+', '+d.getDate()+' '+MONTHS[d.getMonth()]+' '+d.getFullYear(); }
function dateToInput(ts){
  if(ts===null||ts===undefined) return '';
  const d=new Date(ts), z=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate());
}
// Newest first: latest date wins; if two lessons share a date the one uploaded last wins;
// a lesson whose date cannot be read always sorts after lessons with a real date.
function lessonNewerFirst(a,b){
  const ta=parseLessonDate(a.date), tb=parseLessonDate(b.date);
  if(ta!==tb){ if(ta===null) return 1; if(tb===null) return -1; return tb-ta; }
  return (b.seq||0)-(a.seq||0);
}
// Current Theme = the published lesson with the LATEST date. Everything else is an archive.
function pickCurrentLesson(){
  if(!STATE.lessons.length) return null;
  const live = publishedLessons();
  const pool = live.length ? live : STATE.lessons;
  return pool.slice().sort(lessonNewerFirst)[0];
}
function lessonImage(l){ return (l && typeof l.image==='string' && l.image.startsWith('data:image')) ? l.image : ''; }

function watchProfiles(){
  if(!dbReady) return;
  onSnapshot(collection(db,'profiles'), snap=>{
    PROFILES = snap.docs.map(d=>({id:d.id, ...d.data()})).sort((a,b)=>(a.name||'').localeCompare(b.name||''));

/* ===================== PROGRESS (per child, synced to Firestore, cached locally as an offline fallback) ===================== */
function loadLocalProgressCache(id){ try{ return JSON.parse(localStorage.getItem('bibleAdventureProgress_'+id)||'{}'); }catch(e){ return {}; } }
function saveLocalProgressCache(id,p){ try{ localStorage.setItem('bibleAdventureProgress_'+id, JSON.stringify(p)); }catch(e){} }
async function persistProgress(){
  if(!activeProfileId) return;
  const pid = activeProfileId, prog = PROGRESS;
  // A teacher may have marked this child's coloring since this page loaded. Pull any
  // teacher marks in first so this save can never wipe them out of the points total.
  if(dbReady){
    try{
      const snap = await getDoc(doc(db,'progress',pid));
      if(snap.exists() && syncTeacherMarks(prog, snap.data().scores) && pid===activeProfileId) renderPointsPill();
    }catch(e){ /* offline: carry on with what we have */ }
  }
  saveLocalProgressCache(pid, prog);
  if(!dbReady){ setSyncPill('offline'); return; }
  try{ await setDoc(doc(db,'progress',pid), prog, {merge:true}); setSyncPill('ok'); }
  catch(e){ console.error(e); setSyncPill('offline'); }
}
// Coloring = automatic submission points (child) + teacher marks, stored under their own score key
// so they add into the same points total, weekly leaderboard and badges.
const COLORING_SUBMIT_POINTS = 20;   // given automatically when the child saves their coloring
const COLORING_TEACHER_MAX = 30;     // most the teacher can add after viewing the work
const COLORING_TOTAL_POINTS = COLORING_SUBMIT_POINTS + COLORING_TEACHER_MAX;
function teacherMarkKey(lessonId){ return lessonId+':coloringTeacher'; }
function recomputePoints(prog){ prog.points = Object.values(prog.scores||{}).reduce((s,v)=>s+(Number(v.score)||0),0); }
function syncTeacherMarks(prog, serverScores){
  let changed=false;
  Object.keys(serverScores||{}).filter(k=>k.endsWith(':coloringTeacher')).forEach(k=>{
    const sv = Number(serverScores[k] && serverScores[k].score)||0, cur = prog.scores[k];
    if(!cur || cur.score!==sv){ prog.scores[k] = {score:sv, max:COLORING_TEACHER_MAX}; changed=true; }
  });
  if(changed) recomputePoints(prog);
  return changed;
}
async function loadProgressForActiveProfile(){
  if(!activeProfileId){ PROGRESS = normalizeProgress({}); return; }
  if(dbReady){
    try{
      const snap = await getDoc(doc(db,'progress',activeProfileId));
      PROGRESS = normalizeProgress(snap.exists() ? snap.data() : loadLocalProgressCache(activeProfileId));
      setSyncPill('ok');
      return;
    }catch(e){ console.error(e); setSyncPill('offline'); }
  }
  PROGRESS = normalizeProgress(loadLocalProgressCache(activeProfileId));
}
function recordActivityScore(lessonId, type, rawScore, maxScore, countAsPlay){
  const key = lessonId+':'+type;
  const prev = PROGRESS.scores[key] || {score:0, max:maxScore};
  const capped = Math.max(0, Math.min(maxScore, Math.max(prev.score, rawScore)));
  PROGRESS.scores[key] = {score:capped, max:maxScore};
  if(countAsPlay) PROGRESS.playCounts[key] = (PROGRESS.playCounts[key]||0) + 1;
  markCompleted(lessonId, type);
  PROGRESS.points = Object.values(PROGRESS.scores).reduce((s,v)=>s+v.score,0);
  PROGRESS.lastActive = Date.now();
  persistProgress();
  renderPointsPill();
}
function totalPlays(){ return Object.values(PROGRESS.playCounts).reduce((s,v)=>s+v,0); }
function markCompleted(lessonId, activityType){
  PROGRESS.completed[lessonId] = PROGRESS.completed[lessonId] || {};
  PROGRESS.completed[lessonId][activityType] = true;
  PROGRESS.lastActive = Date.now();
}
function renderPointsPill(){
  document.getElementById('pointsPill').textContent = '⭐ ' + (PROGRESS.points||0) + ' Adventure Points';
  const cp = document.getElementById('challengePill');
  if(cp) cp.textContent = '🏁 ' + ((PROGRESS.challenge && PROGRESS.challenge.points)||0) + ' Challenge Points';
}

/* Tapping a name in the picker no longer opens it directly — a child with a
   PIN set must enter it first, so other children can't wander into their page. */
function attemptOpenProfile(id){
  const p = PROFILES.find(x=>x.id===id); if(!p) return;
  if(!p.pinHash){ chooseProfile(id); return; }
  pinTargetId = id; childPinBuffer=''; childPinError='';
  profileModalMode = 'pin';
  renderProfileModal();
}
function childPinPress(d){
  if(childPinBuffer.length>=4) return;
  childPinBuffer += d; childPinError='';
  renderProfileModal();
  if(childPinBuffer.length===4) childPinSubmit();
}
function childPinClear(){ childPinBuffer=''; childPinError=''; renderProfileModal(); }
function pinBackToPicker(){ profileModalMode='pick'; childPinBuffer=''; childPinError=''; pinTargetId=null; renderProfileModal(); }
async function childPinSubmit(){
  const p = PROFILES.find(x=>x.id===pinTargetId);
  if(!p){ pinBackToPicker(); return; }
  const hash = await sha256(childPinBuffer);
  if(hash === p.pinHash){
    profileModalMode='pick'; pinTargetId=null;
    await chooseProfile(p.id);
  } else {
    childPinBuffer=''; childPinError='That PIN is not right. Try again, or ask a teacher for help.';
    renderProfileModal();
  }
}

async function removeProfile(id){
  const p = PROFILES.find(x=>x.id===id);
  if(!confirm('Remove '+((p&&p.name)||'this profile')+' and their progress? This cannot be undone.')) return;
  try{
    if(dbReady){ await deleteDoc(doc(db,'profiles',id)); await deleteDoc(doc(db,'progress',id)).catch(()=>{}); }
  }catch(e){ alert('Could not remove this profile online. Check the connection and try again.'); return; }
  try{ localStorage.removeItem('bibleAdventureProgress_'+id); }catch(e){}
  if(activeProfileId===id){ activeProfileId=null; try{localStorage.removeItem('bibleAdventureActiveId');}catch(e){} PROGRESS=normalizeProgress({}); renderProfileChip(); renderPointsPill(); }
  renderProfileModal(); refreshCurrentScreen();
}
async function resetChildPin(id){
  const p = PROFILES.find(x=>x.id===id); if(!p) return;
  const wantsNew = confirm('Set a new PIN for '+(p.name||'this child')+'? Click Cancel instead to remove their PIN (no PIN required to open their page).');
  try{
    if(wantsNew){
      const newPin = prompt('Enter a new 4-digit PIN for '+(p.name||'this child')+':');
      if(newPin===null) return;
      if(!/^\d{4}$/.test(newPin)){ alert('The PIN must be exactly 4 digits.'); return; }
      await updateDoc(doc(db,'profiles',id), {pinHash: await sha256(newPin)});
      alert('PIN updated.');
    } else {
      await updateDoc(doc(db,'profiles',id), {pinHash: null});
      alert('PIN removed — '+(p.name||'this child')+' can open their page without a PIN now.');
    }
  }catch(e){ alert('Could not update the PIN online. Check the connection and try again.'); }
}
async function chooseProfile(id){
  activeProfileId = id;
  try{ localStorage.setItem('bibleAdventureActiveId', id); }catch(e){}
  await loadProgressForActiveProfile();
  closeProfileModal(); renderProfileChip(); renderPointsPill(); refreshCurrentScreen();
}
async function saveProfileAndStart(){
  const name = document.getElementById('profileNameInput').value.trim().slice(0,30);
  if(!name){ alert('Please enter a name.'); return; }
  if(!dbReady){ alert('Firebase is not configured yet — see SETUP.md.'); return; }
  const pin1 = (document.getElementById('profilePinInput').value||'').trim();
  const pin2 = (document.getElementById('profilePinConfirm').value||'').trim();
  let pinHashValue; // undefined = leave unchanged (edit only); null = no PIN; string = new hash
  if(pin1 || pin2){
    if(!/^\d{4}$/.test(pin1)){ alert('The PIN must be exactly 4 digits.'); return; }
    if(pin1!==pin2){ alert('The two PINs do not match.'); return; }
    pinHashValue = await sha256(pin1);
  } else if(!editingProfileId){
    pinHashValue = null;
  }
  try{
    if(editingProfileId){
      const patch = {name, ageGroup: pendingAge};
      if(pinHashValue !== undefined) patch.pinHash = pinHashValue;
      await updateDoc(doc(db,'profiles',editingProfileId), patch);
    } else {
      const ref = await addDoc(collection(db,'profiles'), {name, ageGroup: pendingAge, pinHash: pinHashValue, createdAt: serverTimestamp()});
      activeProfileId = ref.id;
      try{ localStorage.setItem('bibleAdventureActiveId', ref.id); }catch(e){}
      PROGRESS = normalizeProgress({});
      await persistProgress();
    }
  }catch(e){ alert('Could not save this profile online. Check the connection and try again.'); return; }
  closeProfileModal(); renderProfileChip(); renderPointsPill(); refreshCurrentScreen();
}

const LB_TABS = {leaderboardWeek:'week', leaderboardAll:'all', leaderboardChallenge:'challenge'};
function go(id, btn){
  // Old screen names still work: they open the matching Leaderboard tab / Challenge activity.
  if(LB_TABS[id]){ leaderboardTab=LB_TABS[id]; id='leaderboard'; btn=null; }
  else if(id==='challenge'){ currentActivity='challenge'; id='activity'; btn=null; }
  renderToken++;
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelectorAll('#mainNav button').forEach(b=>b.classList.remove('active'));
  const target = btn || document.querySelector('#mainNav button[data-screen="'+id+'"]');
  if(target) target.classList.add('active');
  if(id==='home') renderHome();
  if(id==='current') renderCurrentTheme();
  if(id==='lesson') renderLessonScreen();
  if(id==='activity') renderActivityScreen();
  if(id==='badges') renderBadges();
  if(id==='leaderboard') renderLeaderboardPage();
  if(id==='downloads') renderDownloadsPage();
  if(id==='reading') renderBibleReading();
  if(id==='teacher') renderTeacherGate();
  window.scrollTo({top:0, behavior:'instant'});
}

}

// Group lessons by theme. Themes are matched ignoring case/extra spaces, so
// "The Lord is my Shepherd" and "the lord is my  shepherd" land in the same tab.
// Themes are ordered by their newest lesson; lessons inside a theme are newest first.
function themeKeyOf(l){ return String(l.theme||'').trim().replace(/\s+/g,' ').toLowerCase(); }
function groupLessonsByTheme(list){
  const map = new Map();
  list.slice().sort(lessonNewerFirst).forEach(l=>{
    const k = themeKeyOf(l);
    if(!map.has(k)) map.set(k, {key:k, label:(String(l.theme||'').trim().replace(/\s+/g,' ') || 'Other lessons'), lessons:[]});
    map.get(k).lessons.push(l);
  });
  return Array.from(map.values());   // insertion order = newest theme first
}

  const el = document.getElementById('lesson');
  if(!STATE.lessons.length){ el.innerHTML = `<div class="banner warn">No lessons yet.</div>`; return; }
  const visible = publishedLessons();
  if(!visible.length && !teacherPreviewMode){ el.innerHTML = `<div class="banner warn">No lessons have been published yet.</div>`; return; }
  const cur = pickCurrentLesson();

  el.innerHTML = `

    <div class="theme-sub">Lessons under “${esc(activeGroup.label)}”</div>
    <div class="toolbar" style="margin-top:6px">${lessonTabs}</div>

/* ---- Word search ---- */
let wsWords=[], wsFound=new Set(), wsSelecting=null, wsWordPoolLen=0, wsBuiltGrid=null, wsBuiltSize=0;
function buildWordSearch(words, size, dirs){
  const grid = Array.from({length:size},()=>Array(size).fill(''));
  const placed = [];
  words.forEach(word=>{
    let ok=false, tries=0;
    while(!ok && tries<300){
      tries++;
      const dir = dirs[Math.floor(Math.random()*dirs.length)];
      const rLo = dir[0]<0?word.length-1:0, rHi = dir[0]>0?size-word.length:size-1;
      const cLo = dir[1]<0?word.length-1:0, cHi = dir[1]>0?size-word.length:size-1;
      if(rHi<rLo||cHi<cLo) continue;
      const r0 = rLo+Math.floor(Math.random()*(rHi-rLo+1)), c0 = cLo+Math.floor(Math.random()*(cHi-cLo+1));
      let fits=true;
      for(let i=0;i<word.length;i++){ const r=r0+dir[0]*i,c=c0+dir[1]*i;
        if(r<0||c<0||r>=size||c>=size){fits=false;break;} if(grid[r][c]&&grid[r][c]!==word[i]){fits=false;break;} }
      if(fits){ for(let i=0;i<word.length;i++) grid[r0+dir[0]*i][c0+dir[1]*i]=word[i]; placed.push({word,r0,c0,dir}); ok=true; }
    }
  });
  const letters='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  for(let r=0;r<size;r++) for(let c=0;c<size;c++) if(!grid[r][c]) grid[r][c]=letters[Math.floor(Math.random()*26)];
  return {grid, placed};
}
function renderWordSearch(l, box){
  const age = ageKey(); let size, wordPool, dirs, cell;
  if(age==='3-5'){ size=6; wordPool=l.vocabulary.filter(w=>w.length<=5).slice(0,3); dirs=[[0,1],[1,0]]; cell=42; }
  else if(age==='10-12'){ size=13; wordPool=l.vocabulary.filter(w=>w.length<=13); dirs=[[0,1],[1,0],[1,1],[0,-1],[-1,0],[-1,-1]]; cell=30; }
  else { size=10; wordPool=l.vocabulary.filter(w=>w.length<=10); dirs=[[0,1],[1,0],[1,1]]; cell=34; }
  if(!wordPool.length) wordPool = l.vocabulary.slice(0,3).map(w=>w.slice(0,size));
  const built = buildWordSearch(wordPool, size, dirs);
  wsWords = built.placed; const listed = built.placed.map(p=>p.word); wsWordPoolLen = listed.length;
  wsBuiltGrid = built.grid; wsBuiltSize = size;
  wsFound = new Set(); wsSelecting=null;
  box.innerHTML = `<h2>🔤 Word search</h2><p class="muted">Tap the first letter of a word, then tap its last letter.</p>
    <div class="grid-scroll"><div class="word-grid" id="wsGridEl" style="grid-template-columns:repeat(${size},${cell}px)"></div></div>
    <div class="wordlist" id="wsWordlist">${listed.map(w=>`<span id="wsw-${w}">${esc(w)}</span>`).join('')}</div>
    <div class="toolbar">
      <button class="btn secondary" onclick="printWordSearch(false)">🖨️ Print worksheet</button>
      <button class="btn secondary" onclick="printWordSearch(true)">🖨️ Print answer key</button>
    </div>
    <div id="wsFeedback" class="feedback" role="status"></div><div id="wsDone"></div>`;
  const gridEl = document.getElementById('wsGridEl');
  for(let r=0;r<size;r++) for(let c=0;c<size;c++){
    const d=document.createElement('button'); d.type='button'; d.className='letter'; d.style.width=cell+'px'; d.style.height=cell+'px';
    d.textContent=built.grid[r][c]; d.dataset.r=r; d.dataset.c=c; d.onclick=()=>wsClick(r,c); gridEl.appendChild(d);
  }
}
function wsClick(r,c){
  if(!wsSelecting){ wsSelecting={r,c}; markSel(r,c,true); return; }
  const start = wsSelecting; wsSelecting=null; markSel(start.r,start.c,false);
  let matched=null;
  wsWords.forEach(p=>{
    if(wsFound.has(p.word)) return;
    const endR=p.r0+p.dir[0]*(p.word.length-1), endC=p.c0+p.dir[1]*(p.word.length-1);
    if((start.r===p.r0&&start.c===p.c0&&r===endR&&c===endC)||(r===p.r0&&c===p.c0&&start.r===endR&&start.c===endC)) matched=p;
  });
  const fb=document.getElementById('wsFeedback');
  if(!matched){ fb.textContent='Not a word yet — try another pair of letters.'; fb.style.color='#6B6178'; return; }
  wsFound.add(matched.word);
  for(let i=0;i<matched.word.length;i++){ const cellEl=document.querySelector(`.letter[data-r="${matched.r0+matched.dir[0]*i}"][data-c="${matched.c0+matched.dir[1]*i}"]`); if(cellEl) cellEl.classList.add('found'); }
  const chip=document.getElementById('wsw-'+matched.word); if(chip) chip.classList.add('done');
  const maxScore=wsWordPoolLen*5+15, allFound=wsFound.size===wsWordPoolLen;
  recordActivityScore(currentLessonId,'wordsearch', wsFound.size*5+(allFound?15:0), maxScore, allFound);
  if(allFound){ fb.textContent='🎉 All words found!'; fb.style.color='#1E8A4C';
    document.getElementById('wsDone').innerHTML=`<p class="muted">${bankedLine(currentLessonId,'wordsearch',maxScore)}</p>${againBar(`renderWordSearch(getLesson('${currentLessonId}'),document.getElementById('activityBox'))`)}`;
  } else { fb.textContent='Nice find! Keep going.'; fb.style.color='#1E8A4C'; }
}
function markSel(r,c,on){ const cell=document.querySelector(`.letter[data-r="${r}"][data-c="${c}"]`); if(cell) cell.classList.toggle('sel',on); }
function printWordSearch(withAnswers){
  if(!wsBuiltGrid) return;

    return false;
  });
  const rowsHTML = wsBuiltGrid.map((row,r)=>`<tr>${row.map((ch,c)=>
    `<td${withAnswers && inWord(r,c) ? ' style="background:#FFE9A8"' : ''}>${esc(ch)}</td>`
  ).join('')}</tr>`).join('');

    <table class="print-ws-grid">${rowsHTML}</table>

    <p class="print-wordlist">${words.map(esc).join('&nbsp;&nbsp;•&nbsp;&nbsp;')}</p>
    <p class="print-footer">The Covenant Nation Lekki — Bible Adventure Sunday School</p>

  window.print();
}

/* ---- Crossword (ages 6–9 and 10–12) ---- */
const CW_MAX_LEN = 15;
const CW_KEYS = [['6-9','tfCw69','🐑 Explorers (6–9)'],['10-12','tfCw1012','🦁 Voyagers (10–12)']];
function cwCleanAnswer(s){ return String(s||'').toUpperCase().replace(/[^A-Z]/g,''); }
function cwCleanEntries(raw){
  const seen=new Set(), out=[];
  (Array.isArray(raw)?raw:[]).forEach(e=>{
    const a=cwCleanAnswer(e&&e.answer), clue=String((e&&e.clue)||'').trim();
    if(a.length>=2 && a.length<=CW_MAX_LEN && clue && !seen.has(a)){ seen.add(a); out.push({answer:a, clue}); }
  });
  return out;
}
function cwEntriesFor(l, age){ return cwCleanEntries(l && l.crossword && l.crossword[age]); }

/* Deterministic layout: the same words always give the same grid, so the
   teacher's preview, the child's screen and the printed sheet all match. */
function cwBuildLayout(entries){
  const key=(r,c)=>r+','+c;
  const byLen = entries.map((e,i)=>i).sort((a,b)=>entries[b].answer.length-entries[a].answer.length || a-b);
  let best=null;
  const tries=Math.min(byLen.length,12);
  for(let t=0;t<tries;t++){
    const order=[byLen[t]].concat(byLen.filter((_,k)=>k!==t));
    const cells=new Map(), placed=[];
    let minR=0,maxR=0,minC=0,maxC=0;
    const canPlace=(w,r,c,dir)=>{
      const dr=dir?1:0, dc=dir?0:1;
      if(cells.has(key(r-dr,c-dc)) || cells.has(key(r+dr*w.length,c+dc*w.length))) return -1;
      let cross=0;
      for(let i=0;i<w.length;i++){
        const rr=r+dr*i, cc=c+dc*i, ex=cells.get(key(rr,cc));
        if(ex){ if(ex.ch!==w[i] || ex.dirs[dir]) return -1; cross++; }
        else if(cells.has(key(rr+dc,cc+dr)) || cells.has(key(rr-dc,cc-dr))) return -1;
      }
      return cross;
    };
    const put=(idx,r,c,dir)=>{
      const w=entries[idx].answer, dr=dir?1:0, dc=dir?0:1;
      for(let i=0;i<w.length;i++){
        const k=key(r+dr*i,c+dc*i), ex=cells.get(k);
        if(ex) ex.dirs[dir]=true; else { const d=[false,false]; d[dir]=true; cells.set(k,{ch:w[i],dirs:d}); }
      }
      placed.push({idx,r,c,dir});
      minR=Math.min(minR,r); minC=Math.min(minC,c);
      maxR=Math.max(maxR,r+dr*(w.length-1)); maxC=Math.max(maxC,c+dc*(w.length-1));
    };
    put(order[0],0,0,0);
    const remaining=order.slice(1);
    let progress=true;
    while(progress && remaining.length){
      progress=false;
      for(const idx of remaining.slice()){
        const w=entries[idx].answer; let bestC=null;
        cells.forEach((cell,k)=>{
          const [cr,cc]=k.split(',').map(Number);
          for(let i=0;i<w.length;i++){
            if(w[i]!==cell.ch) continue;
            for(const dir of [0,1]){
              if(cell.dirs[dir]) continue;
              const r=dir?cr-i:cr, c=dir?cc:cc-i;
              const x=canPlace(w,r,c,dir); if(x<1) continue;
              const nr=Math.max(maxR,dir?r+w.length-1:r)-Math.min(minR,r)+1;
              const nc=Math.max(maxC,dir?c:c+w.length-1)-Math.min(minC,c)+1;
              const score=x*30-nr*nc;
              if(!bestC||score>bestC.score) bestC={score,r,c,dir};
            }
          }
        });
        if(bestC){ put(idx,bestC.r,bestC.c,bestC.dir); remaining.splice(remaining.indexOf(idx),1); progress=true; }
      }
    }
    const area=(maxR-minR+1)*(maxC-minC+1);
    const cand={placed,minR,minC,rows:maxR-minR+1,cols:maxC-minC+1,area,unplaced:remaining.slice()};
    if(!best || placed.length>best.placed.length || (placed.length===best.placed.length && area<best.area)) best=cand;
  }
  const words=best.placed.map(p=>({answer:entries[p.idx].answer, clue:entries[p.idx].clue,
    r:p.r-best.minR, c:p.c-best.minC, dir:p.dir, num:0}));
  const starts=[...new Set(words.map(w=>w.r*1000+w.c))].sort((a,b)=>a-b);
  words.forEach(w=>{ w.num=starts.indexOf(w.r*1000+w.c)+1; });
  words.sort((a,b)=>a.num-b.num || a.dir-b.dir);
  const grid=Array.from({length:best.rows},()=>Array(best.cols).fill(''));
  const starting={}; // "r,c" -> number
  words.forEach(w=>{
    starting[w.r+','+w.c]=w.num;
    for(let i=0;i<w.answer.length;i++) grid[w.r+(w.dir?i:0)][w.c+(w.dir?0:i)]=w.answer[i];
  });
  return {rows:best.rows, cols:best.cols, grid, words, starting, unplaced:best.unplaced.map(i=>entries[i])};
}

/* ---- Crossword: child game ---- */
let cwLayout=null, cwVals={}, cwInputs={}, cwCellWords={}, cwActive=null, cwDir=0, cwCur=null, cwPrevCell=null,
    cwHints=0, cwSolved=new Set(), cwFinished=false, cwLessonId=null;
function cwWordCells(w){ const out=[]; for(let i=0;i<w.answer.length;i++) out.push([w.r+(w.dir?i:0), w.c+(w.dir?0:i)]); return out; }
function renderCrossword(l, box){
  const age=ageKey(), entries=cwEntriesFor(l, age);
  if(entries.length<2){ box.innerHTML=`<h2>🧩 Crossword</h2><p class="muted">No crossword has been set up for this week yet.</p>`; return; }
  cwLayout=cwBuildLayout(entries); cwLessonId=l.id;
  cwVals={}; cwInputs={}; cwCellWords={}; cwActive=null; cwDir=0; cwCur=null; cwPrevCell=null;
  cwHints=0; cwSolved=new Set(); cwFinished=false;
  const {rows,cols,grid,words,starting}=cwLayout;
  words.forEach((w,i)=>cwWordCells(w).forEach(([r,c])=>{ const k=r+','+c; (cwCellWords[k]=cwCellWords[k]||[null,null])[w.dir]=i; }));
  const base = age==='10-12' ? 36 : 42;
  const wide = box.clientWidth>860;
  const avail = wide ? Math.floor(box.clientWidth*0.55) : Math.max(240, box.clientWidth-48);
  const cell = Math.max(22, Math.min(base, Math.floor((avail-(cols-1)*2)/cols)));
  let gridHTML='';
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
    if(!grid[r][c]){ gridHTML+=`<div class="cw-blank"></div>`; continue; }
    const n=starting[r+','+c];
    gridHTML+=`<div class="cw-cell">${n?`<span class="cw-num">${n}</span>`:''}<input type="text" maxlength="2" data-r="${r}" data-c="${c}" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" aria-label="Row ${r+1}, column ${c+1}${n?', clue '+n:''}"></div>`;
  }
  const clueList=(dir)=>words.map((w,i)=>({w,i})).filter(x=>x.w.dir===dir).map(({w,i})=>
    `<li><button type="button" class="cw-clue" id="cwc-${i}" onclick="cwClueClick(${i})"><b>${w.num}.</b> <span class="cw-ct">${esc(w.clue)}</span> <span class="muted">(${w.answer.length})</span></button></li>`).join('');
  const bank = age==='6-9'
    ? `<div class="wordlist" aria-label="Word bank">${words.map((w,i)=>({a:w.answer,i})).sort((x,y)=>x.a.localeCompare(y.a)).map(x=>`<span id="cwb-${x.i}">${esc(x.a)}</span>`).join('')}</div>` : '';
  box.innerHTML=`<h2>🧩 Crossword</h2>
    <p class="muted">Tap a square and type. Tap the same square again to switch between across and down. ${age==='6-9'?'The word bank shows every answer. ':''}Finish without hints for a 15-point bonus!</p>
    ${bank}
    <div class="cw-now" id="cwNow" aria-live="polite">Tap a square to begin.</div>
    <div class="cw-layout">

      <div class="cw-clues"><div><h3>➡️ Across</h3><ol>${clueList(0)}</ol></div><div><h3>⬇️ Down</h3><ol>${clueList(1)}</ol></div></div>
    </div>
    <div class="toolbar">
      <button class="btn green" onclick="cwCheck()">✅ Check my answers</button>
      <button class="btn gold" onclick="cwHint()">💡 Hint</button>
      <button class="btn secondary" onclick="printCrossword(false)">🖨️ Print worksheet</button>
      <button class="btn secondary" onclick="printCrossword(true)">🖨️ Print answer key</button>
    </div>
    <div id="cwFeedback" class="feedback" role="status"></div><div id="cwDone"></div>`;
  const gridEl=document.getElementById('cwGridEl');
  gridEl.querySelectorAll('input').forEach(inp=>{ cwInputs[inp.dataset.r+','+inp.dataset.c]=inp; });
  gridEl.addEventListener('pointerdown', ()=>{ cwPrevCell=cwCur?{r:cwCur.r,c:cwCur.c}:null; }, true);
  gridEl.addEventListener('focusin', e=>{ if(e.target.matches('input')) cwSetActive(+e.target.dataset.r,+e.target.dataset.c,false); });
  gridEl.addEventListener('click', e=>{
    if(!e.target.matches('input')) return;
    const r=+e.target.dataset.r, c=+e.target.dataset.c;
    if(cwPrevCell && cwPrevCell.r===r && cwPrevCell.c===c) cwSetActive(r,c,true);
    e.target.select();
  });
  gridEl.addEventListener('input', e=>{ if(e.target.matches('input')) cwOnInput(e.target); });
  gridEl.addEventListener('keydown', cwOnKey);
}
function cwSetActive(r,c,toggle){
  const w=cwCellWords[r+','+c]; if(!w) return;
  let dir=cwDir;
  if(w[dir]===null) dir=dir?0:1;
  else if(toggle && w[dir?0:1]!==null) dir=dir?0:1;
  cwDir=dir; cwActive=w[dir]; cwCur={r,c};
  cwHighlight();
}
function cwHighlight(){
  document.querySelectorAll('#cwGridEl .cw-cell').forEach(el=>el.classList.remove('cw-word','cw-cur'));
  document.querySelectorAll('.cw-clue').forEach(b=>b.classList.remove('active'));
  if(cwActive===null) return;
  const w=cwLayout.words[cwActive];
  cwWordCells(w).forEach(([r,c])=>cwInputs[r+','+c].parentElement.classList.add('cw-word'));
  if(cwCur && cwInputs[cwCur.r+','+cwCur.c]) cwInputs[cwCur.r+','+cwCur.c].parentElement.classList.add('cw-cur');
  const b=document.getElementById('cwc-'+cwActive); if(b) b.classList.add('active');
  const now=document.getElementById('cwNow');
  if(now) now.innerHTML=`<b>${w.num} ${w.dir?'Down':'Across'}:</b> ${esc(w.clue)} <span class="muted">(${w.answer.length} letters)</span>`;
}
function cwFocus(r,c){ const inp=cwInputs[r+','+c]; if(inp){ inp.focus(); inp.select(); } }
function cwStep(r,c,step){
  if(cwActive===null) return null;
  const cells=cwWordCells(cwLayout.words[cwActive]);
  const i=cells.findIndex(x=>x[0]===r&&x[1]===c);
  return i<0 ? null : (cells[i+step]||null);
}
function cwOnInput(inp){
  const r=+inp.dataset.r, c=+inp.dataset.c, k=r+','+c;
  const ch=inp.value.replace(/[^a-zA-Z]/g,'').slice(-1).toUpperCase();
  inp.value=ch; cwVals[k]=ch;
  inp.parentElement.classList.remove('wrong','hint');
  cwEvaluate();
  if(ch){ const nx=cwStep(r,c,1); if(nx) cwFocus(nx[0],nx[1]); }
}
function cwOnKey(e){
  const inp=e.target; if(!inp.matches || !inp.matches('input')) return;
  const r=+inp.dataset.r, c=+inp.dataset.c;
  const arrows={ArrowLeft:[0,-1],ArrowRight:[0,1],ArrowUp:[-1,0],ArrowDown:[1,0]};
  if(arrows[e.key]){
    e.preventDefault();
    const [dr,dc]=arrows[e.key]; let rr=r+dr, cc=c+dc;
    while(rr>=0&&cc>=0&&rr<cwLayout.rows&&cc<cwLayout.cols){
      if(cwInputs[rr+','+cc]){ cwDir = dr===0?0:1; cwFocus(rr,cc); return; }
      rr+=dr; cc+=dc;
    }
    return;
  }
  if(e.key==='Backspace' && !inp.value){
    e.preventDefault();
    const pv=cwStep(r,c,-1);
    if(pv){ const pi=cwInputs[pv[0]+','+pv[1]]; pi.value=''; cwVals[pv[0]+','+pv[1]]=''; pi.parentElement.classList.remove('wrong','hint'); cwEvaluate(); cwFocus(pv[0],pv[1]); }
  }
}
function cwClueClick(i){
  const w=cwLayout.words[i]; cwDir=w.dir;
  const [r,c]=cwWordCells(w)[0];
  cwFocus(r,c);
}
function cwEvaluate(){
  const words=cwLayout.words, solved=new Set();
  document.querySelectorAll('#cwGridEl .cw-cell').forEach(el=>el.classList.remove('solved'));
  words.forEach((w,i)=>{
    const cells=cwWordCells(w);
    const ok=cells.every(([r,c],k)=>cwVals[r+','+c]===w.answer[k]);
    const btn=document.getElementById('cwc-'+i), chip=document.getElementById('cwb-'+i);
    if(btn) btn.classList.toggle('done',ok);
    if(chip) chip.classList.toggle('done',ok);
    if(ok){ solved.add(i); cells.forEach(([r,c])=>cwInputs[r+','+c].parentElement.classList.add('solved')); }
  });
  const prev=cwSolved.size; cwSolved=solved;
  const n=words.length, all=solved.size===n, maxScore=n*5+15;
  if(solved.size>prev || (all && !cwFinished)){
    recordActivityScore(cwLessonId,'crossword', solved.size*5+(all&&cwHints===0?15:0), maxScore, all&&!cwFinished);
  }
  const fb=document.getElementById('cwFeedback');
  if(all && !cwFinished){
    cwFinished=true;
    if(fb){ fb.textContent=cwHints===0?'🎉 Crossword complete — no hints needed!':'🎉 Crossword complete!'; fb.style.color='#1E8A4C'; }
    const done=document.getElementById('cwDone');
    if(done) done.innerHTML=`<p class="muted">${bankedLine(cwLessonId,'crossword',maxScore)}</p>${againBar(`renderCrossword(getLesson('${cwLessonId}'),document.getElementById('activityBox'))`)}`;
  } else if(solved.size>prev && fb){
    fb.textContent=`Well done! ${solved.size} of ${n} words solved.`; fb.style.color='#1E8A4C';
  }
}
function cwCheck(){
  if(!cwLayout) return;
  let wrong=0, filled=0;
  Object.keys(cwInputs).forEach(k=>{
    const [r,c]=k.split(',').map(Number), v=cwVals[k]||'', el=cwInputs[k].parentElement;
    el.classList.remove('wrong');
    if(v){ filled++; if(v!==cwLayout.grid[r][c]){ el.classList.add('wrong'); wrong++; } }
  });
  const fb=document.getElementById('cwFeedback'); if(!fb) return;
  if(wrong){ fb.textContent=`${wrong} letter${wrong===1?' needs':'s need'} another look (marked in red).`; fb.style.color='#D14343'; }
  else if(!filled){ fb.textContent='Type some letters first, then check.'; fb.style.color='#6B6178'; }
  else if(!cwFinished){ fb.textContent='So far so good — keep going!'; fb.style.color='#1E8A4C'; }
}
function cwHint(){
  if(!cwLayout || cwFinished) return;
  const words=cwLayout.words;
  const missing=w=>cwWordCells(w).findIndex(([r,c],k)=>cwVals[r+','+c]!==w.answer[k]);
  let w = cwActive!==null ? words[cwActive] : null;
  if(!w || missing(w)<0) w = words.find(x=>missing(x)>=0);
  if(!w) return;
  const [r,c]=cwWordCells(w)[missing(w)], k=r+','+c;
  cwVals[k]=w.answer[missing(w)];
  cwInputs[k].value=cwVals[k];
  cwInputs[k].parentElement.classList.remove('wrong');
  cwInputs[k].parentElement.classList.add('hint');
  cwHints++;
  cwActive=words.indexOf(w); cwDir=w.dir; cwCur={r,c}; cwHighlight();
  cwEvaluate();
  const fb=document.getElementById('cwFeedback');
  if(fb && !cwFinished){ fb.textContent='💡 One letter revealed (the no-hints bonus is gone, but you can still finish!)'; fb.style.color='#2E6FB0'; }
}
function printCrossword(withAnswers){
  if(!cwLayout) return;
  const l=getLesson(currentLessonId), {rows,cols,grid,words,starting}=cwLayout;
  let table='';
  for(let r=0;r<rows;r++){
    table+='<tr>';

      if(!grid[r][c]){ table+='<td></td>'; continue; }
      const n=starting[r+','+c];

    }

  const list=(dir)=>words.filter(w=>w.dir===dir).map(w=>`<p><b>${w.num}.</b> ${esc(w.clue)} (${w.answer.length})</p>`).join('');
  document.getElementById('printArea').innerHTML=`<div class="print-page">
    <h1>🌟 Bible Adventure — Crossword</h1>

    ${withAnswers?'':'<p class="print-name">Name: ______________________________</p>'}
    <table class="print-cw">${table}</table>

    <p class="print-footer">The Covenant Nation Lekki — Bible Adventure Sunday School</p>
  </div>`;
  window.print();
}

function loadImageToCanvas(canvas, src){
  return new Promise(resolve=>{
    const img = new Image();
    img.onload = ()=>{
      const MAX=640; const scale=Math.min(1, MAX/img.width);
      canvas.width=Math.round(img.width*scale); canvas.height=Math.round(img.height*scale);
      coloringCtx.fillStyle='#fff'; coloringCtx.fillRect(0,0,canvas.width,canvas.height);
      coloringCtx.drawImage(img,0,0,canvas.width,canvas.height);
      resolve();
    };
    img.onerror=()=>resolve();
    img.src=src;
  });
}
/* ---- Zoom: scales the canvas's on-screen CSS size; the underlying pixel
   resolution (and so drawing/fill precision) never changes. */
function applyColoringZoom(){
  const canvas=document.getElementById('coloringCanvas');
  if(!canvas || !canvas.width) return;
  canvas.style.width = Math.round(canvas.width*coloringZoom)+'px';
  canvas.style.height = Math.round(canvas.height*coloringZoom)+'px';
  canvas.classList.toggle('zoomed', coloringZoom>1);
  const label=document.getElementById('zoomLabel'); if(label) label.textContent=Math.round(coloringZoom*100)+'%';
}
function zoomColoring(dir){
  if(dir===0) coloringZoom=1;
  else coloringZoom=Math.max(0.5, Math.min(2.5, Math.round((coloringZoom+dir*0.25)*100)/100));
  applyColoringZoom();
}
/* ---- Undo / redo: snapshots are pushed once per completed stroke or fill,
   not per pixel, to keep the history small and each step meaningful. */
function pushColoringHistory(){
  if(!coloringCtx) return;
  const canvas=document.getElementById('coloringCanvas');
  try{
    coloringHistory.push(coloringCtx.getImageData(0,0,canvas.width,canvas.height));
    if(coloringHistory.length>COLORING_HISTORY_LIMIT) coloringHistory.shift();
    coloringRedoStack=[];
  }catch(e){}
  updateUndoRedoButtons();
}
function undoColoring(){
  if(!coloringHistory.length || !coloringCtx) return;
  const canvas=document.getElementById('coloringCanvas');
  coloringRedoStack.push(coloringCtx.getImageData(0,0,canvas.width,canvas.height));
  coloringCtx.putImageData(coloringHistory.pop(),0,0);
  updateUndoRedoButtons();
}
function redoColoring(){
  if(!coloringRedoStack.length || !coloringCtx) return;
  const canvas=document.getElementById('coloringCanvas');
  coloringHistory.push(coloringCtx.getImageData(0,0,canvas.width,canvas.height));
  coloringCtx.putImageData(coloringRedoStack.pop(),0,0);
  updateUndoRedoButtons();
}
function updateUndoRedoButtons(){
  const u=document.getElementById('undoBtn'), r=document.getElementById('redoBtn');
  if(u) u.disabled = coloringHistory.length===0;
  if(r) r.disabled = coloringRedoStack.length===0;
}
function attachCanvasHandlers(canvas){
  canvas.onpointerdown=e=>{
    e.preventDefault();
    const pos=canvasPos(canvas,e);
    if(coloringTool==='fill'){ pushColoringHistory(); floodFill(pos.x,pos.y,coloringColor); }
    else{ pushColoringHistory(); coloringDrawing=true; paintDot(pos.x,pos.y); }
  };
  canvas.onpointermove=e=>{
    if(!coloringDrawing || coloringTool!=='brush') return;
    e.preventDefault();
    const pos=canvasPos(canvas,e); paintDot(pos.x,pos.y);
  };
  const stop=()=>{ coloringDrawing=false; };
  canvas.onpointerup=stop; canvas.onpointerleave=stop; canvas.onpointercancel=stop;
}
function canvasPos(canvas,e){
  const rect=canvas.getBoundingClientRect();
  const scaleX=canvas.width/rect.width, scaleY=canvas.height/rect.height;
  return { x:Math.floor((e.clientX-rect.left)*scaleX), y:Math.floor((e.clientY-rect.top)*scaleY) };
}
function paintDot(x,y){
  if(!coloringCtx) return;
  coloringCtx.fillStyle=coloringColor;

  coloringCtx.arc(x,y,coloringBrushSize/2,0,Math.PI*2);
  coloringCtx.fill();
}
function hexToRgb(hex){
  const v=hex.replace('#','');

}
function floodFill(x,y,hex){
  const canvas=document.getElementById('coloringCanvas');
  const w=canvas.width,h=canvas.height;
  if(x<0||y<0||x>=w||y>=h||!coloringCtx) return;
  const imgData=coloringCtx.getImageData(0,0,w,h);
  const data=imgData.data;
  const startIdx=(y*w+x)*4;
  const startR=data[startIdx],startG=data[startIdx+1],startB=data[startIdx+2];
  const [fr,fg,fb]=hexToRgb(hex);
  if(Math.abs(startR-fr)<10 && Math.abs(startG-fg)<10 && Math.abs(startB-fb)<10) return; // already this color
  const tolerance=48, toleranceSq=tolerance*tolerance;
  const stack=[x,y]; const visited=new Uint8Array(w*h);
  while(stack.length){
    const cy=stack.pop(), cx=stack.pop();
    if(cx<0||cy<0||cx>=w||cy>=h) continue;
    const vIdx=cy*w+cx; if(visited[vIdx]) continue;
    const i=vIdx*4;
    const dr=data[i]-startR, dg=data[i+1]-startG, db=data[i+2]-startB;
    if((dr*dr+dg*dg+db*db) > toleranceSq) continue;
    visited[vIdx]=1;
    data[i]=fr; data[i+1]=fg; data[i+2]=fb; data[i+3]=255;
    stack.push(cx+1,cy, cx-1,cy, cx,cy+1, cx,cy-1);
  }
  coloringCtx.putImageData(imgData,0,0);
}

/* ---- Maze ---- */
// A fresh, always-solvable maze is generated every time with a recursive
// backtracker (carve a random path through every cell, no teacher content
// needed) — same approach used by every maze generator of this kind.
let mazeGrid=null, mazeSize=0, mazePath=[], mazeMode='tap', mazeTracing=false, mazeSolved=false, mazeGoal=null,
    mazeStartIcon='🐑', mazeGoalIcon='⛪', mazeGoalLabel='the church';
function generateMaze(size){
  const cells = Array.from({length:size},()=>Array.from({length:size},()=>({N:false,S:false,E:false,W:false})));
  const visited = Array.from({length:size},()=>Array(size).fill(false));
  function carve(r,c){
    visited[r][c]=true;
    const dirs=[['N',-1,0,'S'],['S',1,0,'N'],['E',0,1,'W'],['W',0,-1,'E']];
    for(let i=dirs.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [dirs[i],dirs[j]]=[dirs[j],dirs[i]]; }
    for(const [dir,dr,dc,opp] of dirs){
      const nr=r+dr, nc=c+dc;
      if(nr<0||nc<0||nr>=size||nc>=size||visited[nr][nc]) continue;
      cells[r][c][dir]=true; cells[nr][nc][opp]=true;
      carve(nr,nc);
    }
  }
  carve(0,0);
  return cells;
}
// Bigger, harder maze for older age groups. Level 1 of the difficulty slider is
// exactly this starting size; each level up adds 2 rows and 2 columns.
const MAZE_LEVELS = 5, MAZE_LEVEL_STEP = 2, MAZE_MIN_CELL = 24;
let mazeLevel = 1;
function mazeSettingsFor(level){
  const age = ageKey();
  const base = age==='3-5' ? {size:6, cell:46} : age==='10-12' ? {size:13, cell:30} : {size:9, cell:38};
  const size = base.size + (level-1)*MAZE_LEVEL_STEP;
  // Level 1 keeps today's cell size. Bigger mazes shrink the cells so the board stays
  // about the same width, but never below a size a finger can still tap.
  const cell = level===1 ? base.cell : Math.max(MAZE_MIN_CELL, Math.floor(base.size*base.cell/size));
  return {size, cell};
}
function mazeSettings(){ return mazeSettingsFor(mazeLevel); }
function mazeLevelLabel(level){ const {size}=mazeSettingsFor(level); return `Level ${level} of ${MAZE_LEVELS} · ${size} × ${size}`; }
// While the slider is being dragged, only the label changes; the new maze is built when it is released.
function mazeLevelPreview(v){
  const level = Math.max(1, Math.min(MAZE_LEVELS, parseInt(v,10)||1));
  const lab = document.getElementById('mazeLevelLabel'); if(lab) lab.textContent = mazeLevelLabel(level);
  const sl = document.getElementById('mazeLevel'); if(sl) sl.setAttribute('aria-valuetext', mazeLevelLabel(level));
}
function setMazeLevel(v){
  mazeLevel = Math.max(1, Math.min(MAZE_LEVELS, parseInt(v,10)||1));
  renderMaze(getLesson(currentLessonId), document.getElementById('activityBox'));
  const sl = document.getElementById('mazeLevel'); if(sl) sl.focus();   // keep keyboard users on the slider
}
function mazeConnected(a,b){
  if(!mazeGrid) return false;
  const dr=b.r-a.r, dc=b.c-a.c;
  const cell=mazeGrid[a.r][a.c];
  if(dr===-1&&dc===0) return cell.N;
  if(dr===1&&dc===0) return cell.S;
  if(dr===0&&dc===1) return cell.E;
  if(dr===0&&dc===-1) return cell.W;
  return false;
}
// Raw (unescaped) text — callers escape it for innerHTML, or use it as-is
// for textContent (which never interprets HTML entities).
function mazeHintText(){
  return `Help ${mazeStartIcon} find the way to ${mazeGoalLabel}! `
    + (mazeMode==='tap' ? 'Tap a path next to you to move.' : 'Drag your finger along the path.');
}
function renderMaze(l, box){
  const {size, cell} = mazeSettings();
  mazeGrid = generateMaze(size); mazeSize=size;
  mazeGoal={r:size-1,c:size-1};
  mazeStartIcon = l.mazeStartIcon || '🐑';
  mazeGoalIcon = l.mazeGoalIcon || '⛪';
  mazeGoalLabel = l.mazeGoalLabel || 'the church';
  mazePath=[{r:0,c:0}]; mazeSolved=false; mazeTracing=false;
  box.innerHTML = `<h2>🐾 Maze</h2>
    <p class="muted" id="mazeHint">${esc(mazeHintText())}</p>
    <div class="toolbar">
      <button class="btn secondary tool-btn" id="mazeModeTap" onclick="setMazeMode('tap')">👆 Tap to move</button>
      <button class="btn secondary tool-btn" id="mazeModeTrace" onclick="setMazeMode('trace')">✍️ Trace the path</button>
      <button class="btn secondary" onclick="renderMaze(getLesson(currentLessonId), document.getElementById('activityBox'))">🔀 New maze</button>
      <button class="btn secondary" onclick="printMaze()">🖨️ Print this maze</button>
    </div>
    <div class="maze-level">
      <label class="lvl-title" for="mazeLevel">Difficulty</label>
      <span class="lvl-end">Easiest</span>
      <input type="range" id="mazeLevel" min="1" max="${MAZE_LEVELS}" step="1" value="${mazeLevel}"
        aria-valuetext="${esc(mazeLevelLabel(mazeLevel))}" oninput="mazeLevelPreview(this.value)" onchange="setMazeLevel(this.value)">
      <span class="lvl-end">Hardest</span>
      <span id="mazeLevelLabel">${esc(mazeLevelLabel(mazeLevel))}</span>
    </div>
    <div class="grid-scroll"><div class="maze-grid" id="mazeGridEl" style="grid-template-columns:repeat(${size},${cell}px)"></div></div>
    <div id="mazeFeedback" class="feedback" role="status"></div>`;
  updateMazeModeButtons();
  const gridEl = document.getElementById('mazeGridEl');
  const WALL = '3px solid #2E2145';
  for(let r=0;r<size;r++){
    for(let c=0;c<size;c++){
      const cd = mazeGrid[r][c];
      const d=document.createElement('div');
      d.className='maze-cell'; d.dataset.r=r; d.dataset.c=c;
      d.style.width=cell+'px'; d.style.height=cell+'px';
      d.style.borderTop = !cd.N ? WALL : '1px solid transparent';
      d.style.borderLeft = !cd.W ? WALL : '1px solid transparent';
      d.style.borderRight = (c===size-1) ? WALL : 'none';
      d.style.borderBottom = (r===size-1) ? WALL : 'none';
      if(r===0&&c===0) d.classList.add('start');
      if(r===size-1&&c===size-1){ d.classList.add('goal'); d.textContent=mazeGoalIcon; }
      gridEl.appendChild(d);
    }
  }
  renderMazeRunner();
  attachMazeHandlers(gridEl);
}
function updateMazeModeButtons(){
  const t=document.getElementById('mazeModeTap'), r=document.getElementById('mazeModeTrace');
  if(t) t.classList.toggle('active', mazeMode==='tap');
  if(r) r.classList.toggle('active', mazeMode==='trace');
}
function setMazeMode(m){
  mazeMode=m; updateMazeModeButtons();
  const hint=document.getElementById('mazeHint'); if(hint) hint.textContent=mazeHintText();
}
function renderMazeRunner(){
  document.querySelectorAll('.maze-cell.path').forEach(el=>el.classList.remove('path'));
  document.querySelectorAll('.maze-cell .runner').forEach(el=>el.remove());
  mazePath.forEach(p=>{
    const el=document.querySelector(`.maze-cell[data-r="${p.r}"][data-c="${p.c}"]`);
    if(el) el.classList.add('path');
  });
  const last=mazePath[mazePath.length-1];
  const el=document.querySelector(`.maze-cell[data-r="${last.r}"][data-c="${last.c}"]`);
  if(el){ const span=document.createElement('span'); span.className='runner'; span.textContent=mazeStartIcon; el.appendChild(span); }
}
// Shared by both tap-to-move and finger-trace: a step is only ever taken
// to an orthogonal neighbor with no wall in the way. Stepping onto the
// cell just behind you retreats (handy if a trace wobbles off course).
function mazeStep(target){
  if(mazeSolved) return;
  const last = mazePath[mazePath.length-1];
  if(mazePath.length>1 && target.r===mazePath[mazePath.length-2].r && target.c===mazePath[mazePath.length-2].c){
    mazePath.pop(); renderMazeRunner(); return;
  }
  if(target.r===last.r && target.c===last.c) return;
  if(Math.abs(target.r-last.r)+Math.abs(target.c-last.c)!==1) return;
  if(!mazeConnected(last, target)) return;
  mazePath.push(target);
  renderMazeRunner();
  if(target.r===mazeGoal.r && target.c===mazeGoal.c) mazeWin();
}
function attachMazeHandlers(gridEl){
  gridEl.onclick = e=>{
    if(mazeMode!=='tap') return;
    const cellEl = e.target.closest('.maze-cell'); if(!cellEl) return;
    mazeStep({r:+cellEl.dataset.r, c:+cellEl.dataset.c});
  };
  gridEl.onpointerdown = e=>{
    if(mazeMode!=='trace') return;
    const cellEl = e.target.closest('.maze-cell'); if(!cellEl) return;
    const target={r:+cellEl.dataset.r, c:+cellEl.dataset.c};
    const last = mazePath[mazePath.length-1];
    if(target.r===last.r && target.c===last.c) mazeTracing=true;
  };
  gridEl.onpointermove = e=>{
    if(mazeMode!=='trace' || !mazeTracing) return;
    e.preventDefault();
    const el = document.elementFromPoint(e.clientX, e.clientY);
    const cellEl = el && el.closest ? el.closest('.maze-cell') : null;
    if(!cellEl) return;
    mazeStep({r:+cellEl.dataset.r, c:+cellEl.dataset.c});
  };
  const stop=()=>{ mazeTracing=false; };
  gridEl.onpointerup=stop; gridEl.onpointerleave=stop; gridEl.onpointercancel=stop;
}
function mazeWin(){
  mazeSolved=true;
  const fb=document.getElementById('mazeFeedback');
  if(fb){ fb.textContent='🎉 You made it! Well done!'; fb.style.color='#1E8A4C'; }
  recordActivityScore(currentLessonId, 'maze', 15, 15, true);
}
function printMaze(){
  if(!mazeGrid) return;
  const size=mazeSize; const WALL='3px solid #2E2145';
  let rowsHTML='';
  for(let r=0;r<size;r++){
    rowsHTML+='<tr>';
    for(let c=0;c<size;c++){
      const cd=mazeGrid[r][c];
      const bt=!cd.N?WALL:'1px solid transparent', bl=!cd.W?WALL:'1px solid transparent';
      const br=(c===size-1)?WALL:'none', bb=(r===size-1)?WALL:'none';
      let content='';
      if(r===0&&c===0) content=mazeStartIcon; if(r===size-1&&c===size-1) content=mazeGoalIcon;
      rowsHTML += `<td style="width:26px;height:26px;border-top:${bt};border-left:${bl};border-right:${br};border-bottom:${bb};text-align:center;font-size:14px">${esc(content)}</td>`;
    }
    rowsHTML+='</tr>';
  }
  document.getElementById('printArea').innerHTML = `<div class="print-page">
    <h1>🌟 Bible Adventure — Maze</h1>
    <p class="print-sub">Find the way from ${esc(mazeStartIcon)} to ${esc(mazeGoalLabel)} ${esc(mazeGoalIcon)}!</p>
    <table style="border-collapse:collapse;margin:0 auto">${rowsHTML}</table>
    <p class="print-footer">The Covenant Nation Lekki — Bible Adventure Sunday School</p>
  </div>`;
  window.print();
}

/* ---- Unscramble ---- */
let uWordIndex=0, uWords=[];
function shuffleWord(w){ let arr=w.split(''),tries=0; do{ arr.sort(()=>Math.random()-0.5); tries++; }while(arr.join('')===w && tries<10); return arr.join(' '); }
function renderUnscramble(l, box){
  const age=ageKey();
  if(age==='3-5'){ uWords=l.vocabulary.filter(w=>w.length<=5).slice(0,3); if(!uWords.length) uWords=l.vocabulary.slice(0,3); }
  else if(age==='10-12'){ uWords=l.vocabulary.slice(); } else { uWords=l.vocabulary.slice(0,6); }
  uWordIndex=0; showUnscrambleWord(box);
}
function showUnscrambleWord(box){

  box.innerHTML=`<h2>🔀 Unscramble the Bible word</h2><p class="muted">Word ${uWordIndex+1} of ${uWords.length}</p>
    <div class="question" style="letter-spacing:4px">${esc(shuffleWord(word))}</div>${hint}
    <input id="uAns" class="input" placeholder="Type your answer" style="max-width:300px" autocomplete="off" onkeydown="if(event.key==='Enter')checkUnscramble('${word}')">
    <div class="toolbar"><button class="btn" onclick="checkUnscramble('${word}')">Check answer</button></div>
    <div id="uFeedback" class="feedback" role="status"></div>`;

function checkUnscramble(word){

    metric:(prog=PROGRESS)=>Object.values(prog.scores||{}).filter(s=>s.score>=s.max && s.max>0).length,

// Highest tier reached for a family: 0 (none yet) through 5 (all tiers).
// prog defaults to the live PROGRESS so every existing call site (My Badges
// screen) is unaffected; pass another child's normalized progress to score
// them instead — that's what the badges leaderboard below does.
function familyEarnedTier(fam, prog=PROGRESS){
  const val = fam.metric(prog);
  let t = 0;
  for(let i=0;i<fam.tiers.length;i++){ if(val>=fam.tiers[i].threshold) t=i+1; }
  return t;
}
function countBadges(prog=PROGRESS){ return BADGE_FAMILIES.reduce((s,f)=>s+familyEarnedTier(f,prog),0); }

/* ---- Weekly: only what a child did in one lesson's week ----
   Progress is stored per activity under "<lessonId>:<activity>", so a week's
   points are simply that lesson's banked scores. Badge tiers are cumulative,
   so "badges earned this week" = tiers now minus tiers without this week's
   activity. (Who-am-I clues are counted per lesson from this update onward.) */
function weeklyPoints(prog, lessonId){
  const pre = lessonId+':';
  return Object.keys(prog.scores||{}).filter(k=>k.startsWith(pre))
    .reduce((s,k)=>s+(Number(prog.scores[k].score)||0), 0);
}
function progressWithoutLesson(prog, lessonId){
  const pre = lessonId+':';
  const dropKeys = obj => Object.fromEntries(Object.entries(obj||{}).filter(([k])=>!k.startsWith(pre)));
  return Object.assign({}, prog, {
    scores: dropKeys(prog.scores),
    playCounts: dropKeys(prog.playCounts),
    completed: Object.fromEntries(Object.entries(prog.completed||{}).filter(([k])=>k!==lessonId)),
    points: Math.max(0, (Number(prog.points)||0) - weeklyPoints(prog, lessonId)),
    whoAmICorrect: Math.max(0, (prog.whoAmICorrect||0) - ((prog.whoAmIByLesson||{})[lessonId]||0))
  });
}
function weeklyBadges(prog, lessonId){
  return Math.max(0, countBadges(prog) - countBadges(progressWithoutLesson(prog, lessonId)));
}
