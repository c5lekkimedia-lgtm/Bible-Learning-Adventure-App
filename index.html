/* ---- Jigsaw geometry: classic tabs & blanks ---- */
// Shape of a knob along an edge of length 1, v = outward height (before sign).
function jpEdgeSegs(x0,y0,x1,y1,sign,m,rnd){
  // m = depth unit (min cell side); rnd() -> [0,1)
  const dx=x1-x0, dy=y1-y0, L=Math.hypot(dx,dy), ux=dx/L, uy=dy/L, nx=-uy*sign, ny=ux*sign;
  const ds=(rnd()-.5)*.08, k=.94+rnd()*.14, D=m/L*k;     // jitter: knob position and size
  const P=(u,v)=>[x0+ux*L*(u+((u>.3&&u<.7)?ds:0))+nx*L*v*D, y0+uy*L*(u+((u>.3&&u<.7)?ds:0))+ny*L*v*D];
  const segs=[];
  const L_=(u,v)=>segs.push({t:'L',to:P(u,v)});
  const C_=(a,b,c,d,e,f)=>segs.push({t:'C',c1:P(a,b),c2:P(c,d),to:P(e,f)});
  L_(.355,0);
  C_(.42,0,   .41,.03,  .40,.075);      // left side of the neck
  C_(.385,.13, .31,.15, .325,.235);     // swell out to the left of the head
  C_(.34,.31, .43,.32, .50,.32);        // over the top (left half)
  C_(.57,.32, .66,.31, .675,.235);      // over the top (right half)
  C_(.69,.15, .615,.13, .60,.075);      // back in to the right neck
  C_(.59,.03, .58,0,    .645,0);        // right side of the neck
  L_(1,0);
  return {start:[x0,y0], segs};
}
function jpStraight(x0,y0,x1,y1){ return {start:[x0,y0], segs:[{t:'L',to:[x1,y1]}]}; }
function jpReverse(e){
  // same curve walked the other way
  const pts=[e.start]; e.segs.forEach(s=>pts.push(s.to));
  const out=[];
  for(let i=e.segs.length-1;i>=0;i--){
    const s=e.segs[i];
    out.push(s.t==='L' ? {t:'L',to:pts[i]} : {t:'C',c1:s.c2,c2:s.c1,to:pts[i]});
  }
  return {start:pts[pts.length-1], segs:out};
}
const jpF=n=>(Math.round(n*100)/100);
function jpSegD(e){ return e.segs.map(s=>s.t==='L' ? 'L'+jpF(s.to[0])+' '+jpF(s.to[1]) :
  'C'+jpF(s.c1[0])+' '+jpF(s.c1[1])+' '+jpF(s.c2[0])+' '+jpF(s.c2[1])+' '+jpF(s.to[0])+' '+jpF(s.to[1])).join(''); }

// Build every piece of a cols x rows puzzle on a W x H board.
function jpBuild(cols,rows,W,H,rnd){
  const w=W/cols, h=H/rows, m=Math.min(w,h);
  const Hh=[], Vv=[];                       // canonical edges: H goes left->right, V goes top->bottom
  for(let r=0;r<=rows;r++){ Hh[r]=[]; for(let c=0;c<cols;c++){
    Hh[r][c] = (r===0||r===rows) ? jpStraight(c*w,r*h,(c+1)*w,r*h) : jpEdgeSegs(c*w,r*h,(c+1)*w,r*h, rnd()<.5?1:-1, m, rnd); } }
  for(let r=0;r<rows;r++){ Vv[r]=[]; for(let c=0;c<=cols;c++){
    Vv[r][c] = (c===0||c===cols) ? jpStraight(c*w,r*h,c*w,(r+1)*h) : jpEdgeSegs(c*w,r*h,c*w,(r+1)*h, rnd()<.5?1:-1, m, rnd); } }
  const pieces=[];
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
    const top=Hh[r][c], right=Vv[r][c+1], bottom=jpReverse(Hh[r+1][c]), left=jpReverse(Vv[r][c]);
    const d='M'+jpF(c*w)+' '+jpF(r*h)+jpSegD(top)+jpSegD(right)+jpSegD(bottom)+jpSegD(left)+'Z';
    const isEdge = r===0||c===0||r===rows-1||c===cols-1;
    const isCorner = (r===0||r===rows-1)&&(c===0||c===cols-1);
    pieces.push({r,c,d,isEdge,isCorner,cx:c*w+w/2,cy:r*h+h/2});
  }
  return {pieces,w,h,m};
}

/* ===================== BIBLE JIGSAW ===================== */
// Piece counts per age group: the first number is the starting size, the last is the hardest.
const JIG_LEVELS = {'3-5':[6,8,9,10,12], '6-9':[16,20,24,28,32], '10-12':[24,30,36,42,48]};
const JIG_POINTS = 20;   // finishing the starting size earns 20; finishing any harder size (first time) earns 20 more
let J = null, jigLevelIdx = 0;
function jigLevels(){ return JIG_LEVELS[ageKey()] || JIG_LEVELS['6-9']; }
function jigScore(lessonId){ return (PROGRESS.scores[lessonId+':jigsaw']||{score:0}).score||0; }
function jigUnlocked(lessonId){ return jigScore(lessonId) >= JIG_POINTS; }
// Pick the cols x rows split of n whose shape best matches the picture (portrait pictures get tall puzzles).
function jigGrid(n, aspect){
  let best=null;
  for(let r=2;r<=n;r++){
    if(n%r) continue; const c=n/r;
    if(Math.min(c,r)<2 || Math.max(c,r)/Math.min(c,r)>2.5) continue;
    const err=Math.abs(Math.log(c/r)-Math.log(aspect));
    if(!best || err<best.err) best={cols:c, rows:r, err};
  }
  return best || {cols:n, rows:1};
}
function jigControlsHTML(l){
  const levels=jigLevels(), unlocked=jigUnlocked(l.id), score=jigScore(l.id);
  if(!unlocked) jigLevelIdx=0;
  if(jigLevelIdx>levels.length-1) jigLevelIdx=levels.length-1;
  const lock = !unlocked
    ? `🔒 Finish the <strong>${levels[0]}-piece</strong> puzzle first to unlock the difficulty slider.`
    : score>=2*JIG_POINTS
      ? `🔓 You have earned every point for this puzzle. Keep playing at any size to grow your badges!`
      : `🔓 Slider unlocked! Finish a <strong>harder</strong> puzzle once to earn <strong>+${JIG_POINTS} bonus points</strong>. After that, extra plays earn badges only.`;
  return `<div class="jig-controls">
    <div class="jig-slider"><label for="jigRange" class="muted" style="font-weight:800">Difficulty: <strong id="jigCount" style="color:var(--purple-dark)">${levels[jigLevelIdx]} pieces</strong></label>
      <input type="range" id="jigRange" min="0" max="${levels.length-1}" step="1" value="${jigLevelIdx}" ${unlocked?'':'disabled'}
        oninput="jigSliderInput(this.value)" onchange="jigSliderChange(this.value)">
      <div class="jig-ticks">${levels.map(n=>`<span>${n}</span>`).join('')}</div></div>
    <div class="jig-lock" id="jigLock">${lock}</div>
    <div class="toolbar" style="margin:4px 0 0">
      <button class="btn secondary" id="jigPeekBtn" onclick="jigPeek()">👁️ Peek at the picture</button>
      <button class="btn secondary" id="jigEdgeBtn" onclick="jigEdges()">🔲 Edges first</button>
      <button class="btn secondary" onclick="jigShuffle()">🔀 New puzzle</button></div>
    <p class="muted" style="margin:2px 0 0;font-size:13px">💡 Start with the <strong>corners</strong> (two flat sides), then the <strong>edges</strong> (one flat side). Pieces with a <strong>tab</strong> stick out; pieces with a <strong>blank</strong> have a hole that takes a tab.</p>
  </div>`;
}
function renderJigsaw(l, box){
  if(!l.jigsawImage){ box.innerHTML='<p class="muted">No jigsaw has been added for this lesson yet.</p>'; return; }
  const token = renderToken;
  box.innerHTML = `<h2>🖼️ Bible Jigsaw</h2>

    <div id="jigStatus" class="ch-status" aria-live="polite"></div>

function jigStart(){
  const stage=document.getElementById('jigStage'); if(!stage||!J) return;
  const l=J.l, n=jigLevels()[jigLevelIdx], {cols,rows}=jigGrid(n,J.aspect);
  const W=1000, H=Math.round(W/J.aspect);
  const g=jpBuild(cols,rows,W,H,Math.random);
  const cell=Math.max(g.w,g.h), M=Math.round(cell*1.4);
  const uid='j'+Date.now().toString(36);
  J.n=n; J.cols=cols; J.rows=rows; J.W=W; J.H=H; J.M=M; J.cell=cell; J.snap=g.m*0.32;
  J.placed=0; J.total=g.pieces.length; J.done=false; J.drag=null; J.edgesOnly=false;
  // Scatter the loose pieces around the board (never on top of it).
  J.pieces=g.pieces.map(p=>{
    let cx=0, cy=0;
    for(let t=0;t<300;t++){
      cx=-M+cell*.5+Math.random()*(W+2*M-cell); cy=-M+cell*.5+Math.random()*(H+2*M-cell);
      if(cx<-g.w*.2||cx>W+g.w*.2||cy<-g.h*.2||cy>H+g.h*.2) break;
    }
    return Object.assign({}, p, {tx:cx-p.cx, ty:cy-p.cy, placed:false});
  });
  const clips=J.pieces.map((p,i)=>`<clipPath id="${uid}c${i}"><path d="${p.d}"/></clipPath>`).join('');
  const pieceEls=J.pieces.map((p,i)=>`<g class="jp loose ${p.isEdge?'edge':'inner'}" data-i="${i}" transform="translate(${jpF(p.tx)} ${jpF(p.ty)})">
      <g clip-path="url(#${uid}c${i})"><use href="#${uid}pic"/></g>
      <path d="${p.d}" fill="transparent" stroke="rgba(40,20,70,.6)" stroke-width="2.2" stroke-linejoin="round" pointer-events="all"/></g>`).join('');
  stage.classList.remove('complete');
  stage.innerHTML=`<svg viewBox="${-M} ${-M} ${W+2*M} ${H+2*M}" role="img" aria-label="Jigsaw puzzle board">
    <defs><image id="${uid}pic" href="${l.jigsawImage}" x="0" y="0" width="${W}" height="${H}" preserveAspectRatio="none"/>${clips}</defs>
    <rect x="0" y="0" width="${W}" height="${H}" fill="#fff" fill-opacity=".7" stroke="#B79ADB" stroke-width="3" stroke-dasharray="14 10"/>
    <use id="jigGhost" href="#${uid}pic" opacity="0" pointer-events="none"/>
    <g class="jig-guide" fill="none" stroke="rgba(107,63,160,.22)" stroke-width="1.5" pointer-events="none">${J.pieces.map(p=>`<path d="${p.d}"/>`).join('')}</g>
    <g id="jigPlaced"></g><g id="jigLoose">${pieceEls}</g></svg>`;
  J.svg=stage.querySelector('svg'); J.loose=stage.querySelector('#jigLoose'); J.placedLayer=stage.querySelector('#jigPlaced'); J.ghost=stage.querySelector('#jigGhost');
  J.svg.addEventListener('pointerdown',jigDown);
  J.svg.addEventListener('pointermove',jigMove);
  J.svg.addEventListener('pointerup',jigUp);
  J.svg.addEventListener('pointercancel',jigUp);
  const res=document.getElementById('jigResult'); if(res) res.innerHTML='';
  const eb=document.getElementById('jigEdgeBtn'); if(eb) eb.classList.add('secondary');
  jigStatus();
}
function jigStatus(){
  const el=document.getElementById('jigStatus'); if(!el||!J) return;
  const corners=J.pieces.filter(p=>p.isCorner&&!p.placed).length;
  el.textContent = J.done ? `🎉 All ${J.total} pieces placed!` : `🧩 ${J.placed} of ${J.total} pieces placed · ${J.n}-piece puzzle`;
}
function jigPoint(ev){
  const pt=J.svg.createSVGPoint(); pt.x=ev.clientX; pt.y=ev.clientY;
  return pt.matrixTransform(J.svg.getScreenCTM().inverse());
}
function jigSetPos(p,g){ g.setAttribute('transform',`translate(${jpF(p.tx)} ${jpF(p.ty)})`); }
function jigDown(ev){
  if(!J||J.done||J.drag) return;
  const g=ev.target.closest && ev.target.closest('g.jp.loose'); if(!g) return;
  ev.preventDefault();
  const p=J.pieces[+g.dataset.i], pt=jigPoint(ev);
  J.drag={p,g,id:ev.pointerId,ox:pt.x-p.tx,oy:pt.y-p.ty};
  g.classList.add('drag'); J.loose.appendChild(g);          // lift it to the front
  try{ J.svg.setPointerCapture(ev.pointerId); }catch(e){}
}
function jigMove(ev){
  const d=J&&J.drag; if(!d||ev.pointerId!==d.id) return;
  const pt=jigPoint(ev), p=d.p, lo=-J.M+J.cell*.3, hiX=J.W+J.M-J.cell*.3, hiY=J.H+J.M-J.cell*.3;
  p.tx=Math.min(hiX,Math.max(lo,p.cx+pt.x-d.ox))-p.cx;      // keep the piece inside the play area
  p.ty=Math.min(hiY,Math.max(lo,p.cy+pt.y-d.oy))-p.cy;
  jigSetPos(p,d.g);
}
function jigUp(ev){
  const d=J&&J.drag; if(!d||ev.pointerId!==d.id) return;
  J.drag=null; d.g.classList.remove('drag');
  try{ J.svg.releasePointerCapture(ev.pointerId); }catch(e){}
  const p=d.p;
  if(Math.hypot(p.tx,p.ty)<=J.snap){                        // close enough: click into place
    p.tx=0; p.ty=0; p.placed=true; jigSetPos(p,d.g);
    d.g.classList.remove('loose','dim'); d.g.classList.add('snap'); J.placedLayer.appendChild(d.g);
    d.g.style.pointerEvents='none';
    J.placed++; jigStatus();
    if(J.placed===J.total) jigFinish();
  }
}
function jigPeek(){
  if(!J||!J.ghost) return;
  const on=J.ghost.getAttribute('opacity')==='0';
  J.ghost.setAttribute('opacity', on?'.4':'0');
  const b=document.getElementById('jigPeekBtn'); if(b) b.classList.toggle('secondary',!on);
}
function jigEdges(){
  if(!J||!J.svg) return;
  J.edgesOnly=!J.edgesOnly;
  J.svg.querySelectorAll('g.jp.loose.inner').forEach(g=>g.classList.toggle('dim',J.edgesOnly));
  const b=document.getElementById('jigEdgeBtn'); if(b) b.classList.toggle('secondary',!J.edgesOnly);
}
function jigShuffle(){
  if(!J) return;
  if(!J.done && J.placed>0 && !confirm('Start a new puzzle? The pieces you have placed will be scattered again.')) return;
  jigStart();
}
function jigSliderInput(v){
  const el=document.getElementById('jigCount'); if(el) el.textContent=jigLevels()[+v]+' pieces';
}
function jigSliderChange(v){
  if(!J) return;
  const idx=+v;
  if(!J.done && J.placed>0 && !confirm('Change the difficulty? You will start a new puzzle.')){
    const r=document.getElementById('jigRange'); if(r) r.value=jigLevelIdx; jigSliderInput(jigLevelIdx); return;
  }
  jigLevelIdx=idx; jigStart();
}
function jigNextLevel(){ const max=jigLevels().length-1; if(jigLevelIdx<max){ jigLevelIdx++; const r=document.getElementById('jigRange'); if(r) r.value=jigLevelIdx; jigSliderInput(jigLevelIdx); jigStart(); window.scrollTo({top:0,behavior:'smooth'}); } }
function jigFinish(){
  J.done=true;
  const l=J.l, prev=jigScore(l.id), starting=(jigLevelIdx===0);
  let raw=prev, msg;
  if(prev<JIG_POINTS){ raw=JIG_POINTS; msg=`⭐ <strong>+${JIG_POINTS} points!</strong> You finished the ${J.n}-piece puzzle. The difficulty slider is now unlocked — try a harder one for ${JIG_POINTS} more!`; }
  else if(!starting && prev<2*JIG_POINTS){ raw=2*JIG_POINTS; msg=`🌟 <strong>+${JIG_POINTS} bonus points</strong> for finishing a harder ${J.n}-piece puzzle!`; }
  else if(prev>=2*JIG_POINTS){ msg=`✅ Well done! You already have every point for this puzzle — this play adds to your badges.`; }
  else { msg=`✅ Well done! Finish a <strong>harder</strong> puzzle to earn your ${JIG_POINTS} bonus points — this play adds to your badges.`; }
  recordActivityScore(l.id,'jigsaw',raw,2*JIG_POINTS,true);   // every finished play counts towards badges
  const stage=document.getElementById('jigStage'); if(stage) stage.classList.add('complete');
  jigStatus();
  const levels=jigLevels(), unlocked=jigUnlocked(l.id), canGoHarder=unlocked && jigLevelIdx<levels.length-1;
  const name=(l.jigsawName||'').trim();
  const res=document.getElementById('jigResult');
  if(res) res.innerHTML=`<div class="jig-win">🎉 You built the picture${name?`: <span style="font-size:1.15em">${esc(name)}</span>`:''}!<br><span style="font-weight:700">${msg}</span></div>
    <div class="toolbar"><button class="btn" onclick="jigShuffle()">Play again</button>
      ${canGoHarder?`<button class="btn gold" onclick="jigNextLevel()">Try ${levels[jigLevelIdx+1]} pieces ➜</button>`:''}
      <button class="btn secondary" onclick="go('activity')">Choose another activity</button></div>`;
  const bk=document.getElementById('jigBanked'); if(bk) bk.textContent=bankedLine(l.id,'jigsaw',2*JIG_POINTS);
  // refresh the lock message and slider now that the puzzle may have unlocked them
  const r=document.getElementById('jigRange'); if(r){ r.disabled=!unlocked; r.max=levels.length-1; }
  const lock=document.getElementById('jigLock'), sc=jigScore(l.id);
  if(lock) lock.innerHTML = sc>=2*JIG_POINTS ? `🔓 You have earned every point for this puzzle. Keep playing at any size to grow your badges!`
    : `🔓 Slider unlocked! Finish a <strong>harder</strong> puzzle once to earn <strong>+${JIG_POINTS} bonus points</strong>. After that, extra plays earn badges only.`;
}

/* ---- Teacher: jigsaw picture ---- */
let draftJigsawImage=null;
function handleJigsawFile(input){
  const file=input.files && input.files[0]; if(!file) return;
  const note=document.getElementById('jigImgNote');
  if(!/^image\//.test(file.type)){ note.textContent='That file is not an image. Choose a JPG, PNG or WebP.'; return; }
  note.textContent='Preparing image…';
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      const make=(max,q)=>{
        const scale=Math.min(1,max/Math.max(img.width,img.height));
        const c=document.createElement('canvas'); c.width=Math.round(img.width*scale); c.height=Math.round(img.height*scale);
        const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
        return c.toDataURL('image/jpeg',q);
      };
      // Keep it sharp enough to cut into pieces but small enough for the lesson record.
      let out=make(1000,.78);
      if(kb(out)>230) out=make(900,.65);
      if(kb(out)>230) out=make(800,.55);
      if(kb(out)>230) out=make(700,.45);
      draftJigsawImage=out; renderJigsawField();
    };
    img.onerror=()=>{ note.textContent='That image could not be read. Try a different file.'; };
    img.src=e.target.result;
  };
  reader.onerror=()=>{ note.textContent='That image could not be read. Try a different file.'; };
  reader.readAsDataURL(file);
}
function removeDraftJigsaw(){ draftJigsawImage=null; const n=document.getElementById('tfJigsawName'); if(n) n.value=''; renderJigsawField(); }
function renderJigsawField(){
  const wrap=document.getElementById('jigField'); if(!wrap) return;
  wrap.innerHTML = draftJigsawImage ? `
    <img class="img-preview" src="${draftJigsawImage}" alt="Jigsaw picture preview">
    <div class="img-meta">About ${kb(draftJigsawImage)} KB. Children will build this picture from jigsaw pieces.</div>
    <div class="toolbar">
      <label class="btn secondary" style="cursor:pointer">Replace picture<input type="file" accept="image/*" style="display:none" onchange="handleJigsawFile(this)"></label>
      <button class="btn danger" onclick="removeDraftJigsaw()">Remove jigsaw</button>
    </div><div id="jigImgNote" class="img-meta"></div>` : `
    <div class="img-drop"><div style="font-size:30px">🧩</div>
      <p class="muted" style="margin:6px 0 12px">Add a clear, colourful picture of the Bible character or event (optional).</p>
      <label class="btn" style="cursor:pointer">Choose image<input type="file" accept="image/*" style="display:none" onchange="handleJigsawFile(this)"></label>
      <div id="jigImgNote" class="img-meta"></div></div>`;
}

function relativeTime(ts){
  const t = ts && ts.toMillis ? ts.toMillis() : ts;
  if(!t) return 'Never';
  const mins=Math.floor((Date.now()-t)/60000);
  if(mins<1) return 'Just now'; if(mins<60) return mins+' min ago';
  const hrs=Math.floor(mins/60); if(hrs<24) return hrs+' hr'+(hrs===1?'':'s')+' ago';
  const days=Math.floor(hrs/24); if(days<30) return days+' day'+(days===1?'':'s')+' ago';
  return new Date(t).toLocaleDateString();
}

  const d=new Date(latest); d.setDate(d.getDate()+7); return d.getTime();

function kb(dataUri){ return Math.round((dataUri.length*3/4)/1024); }
function handleImageFile(input){
  const file = input.files && input.files[0]; if(!file) return;
  const note = document.getElementById('imgNote');
  if(!/^image\//.test(file.type)){ note.textContent='That file is not an image. Choose a JPG, PNG or WebP.'; return; }
  note.textContent='Preparing image…';
  const reader = new FileReader();
  reader.onload = e=>{
    const img = new Image();
    img.onload = ()=>{
      const MAX=1200; const scale=Math.min(1, MAX/img.width);
      const canvas=document.createElement('canvas'); canvas.width=Math.round(img.width*scale); canvas.height=Math.round(img.height*scale);
      const ctx=canvas.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,canvas.width,canvas.height); ctx.drawImage(img,0,0,canvas.width,canvas.height);
      let out=canvas.toDataURL('image/jpeg',0.7);
      if(kb(out)>350) out=canvas.toDataURL('image/jpeg',0.5);
      if(kb(out)>350) out=canvas.toDataURL('image/jpeg',0.35);
      draftImage=out; renderImageField();
    };
    img.onerror=()=>{ note.textContent='That image could not be read. Try a different file.'; };
    img.src=e.target.result;
  };
  reader.onerror=()=>{ note.textContent='That image could not be read. Try a different file.'; };
  reader.readAsDataURL(file);
}

function handleColoringFile(input){
  const file = input.files && input.files[0]; if(!file) return;
  const note = document.getElementById('colorImgNote');
  if(!/^image\//.test(file.type)){ note.textContent='That file is not an image. Choose a JPG, PNG or WebP.'; return; }
  note.textContent='Preparing image…';
  const reader = new FileReader();
  reader.onload = e=>{
    const img = new Image();
    img.onload = ()=>{
      // PNG (lossless) keeps outlines crisp for the flood-fill tool — unlike
      // the JPEG lesson photo above, this must not introduce compression noise.
      const makeOut = (max)=>{
        const scale=Math.min(1, max/img.width);
        const canvas=document.createElement('canvas'); canvas.width=Math.round(img.width*scale); canvas.height=Math.round(img.height*scale);
        const ctx=canvas.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,canvas.width,canvas.height); ctx.drawImage(img,0,0,canvas.width,canvas.height);
        return canvas.toDataURL('image/png');
      };
      let out = makeOut(900);
      if(kb(out)>500) out = makeOut(650);
      if(kb(out)>500) out = makeOut(450);
      if(kb(out)>500) note.textContent='This image is still quite large after shrinking — a simpler black-and-white outline will work best.';
      draftColoringImage=out; renderColoringField();
    };
    img.onerror=()=>{ note.textContent='That image could not be read. Try a different file.'; };
    img.src=e.target.result;
  };
  reader.onerror=()=>{ note.textContent='That image could not be read. Try a different file.'; };
  reader.readAsDataURL(file);
}

async function changePassword(){
  const msg=document.getElementById('pcMsg'); msg.style.color='#D14343';
  const oldPw=document.getElementById('pcOld').value, a=document.getElementById('pcNew').value, b=document.getElementById('pcNew2').value;
  if(a.length<6){ msg.textContent='Use at least 6 characters.'; return; }
  if(a!==b){ msg.textContent='The two new passwords do not match.'; return; }
  try{
    const cred = EmailAuthProvider.credential(auth.currentUser.email, oldPw);
    await reauthenticateWithCredential(auth.currentUser, cred);
    await updatePassword(auth.currentUser, a);
    msg.style.color='#1E8A4C'; msg.textContent='Password updated.';
  }catch(e){ msg.textContent='Could not update the password — check the current password and try again.'; }
}

async function publishLesson(){
  const banner=document.getElementById('teacherBanner');
  const topic=val('tfTopic'), summary=val('tfSummary');
  banner.style.display='block';
  if(!topic||!summary){ banner.style.background='#FFF3D6'; banner.textContent='Add at least the topic and the Bible story summary.'; return; }
  let quiz=[]; const quizRaw=val('tfQuiz');
  if(quizRaw){ try{ quiz=JSON.parse(quizRaw); }catch(e){ banner.style.background='#FDEBEB'; banner.textContent='The quiz JSON has a typo. Fix it, or clear the box to publish without a quiz.'; return; } }
  const crossword = {}; let cwProblem='';
  CW_KEYS.forEach(([k])=>{
    const out=[], seen=new Set();
    teacherCrossword[k].filter(e=>(e.answer||'').trim()||(e.clue||'').trim()).forEach(e=>{
      const a=cwCleanAnswer(e.answer), clue=(e.clue||'').trim();
      if(!a||!clue){ cwProblem='Crossword ('+k+'): every row needs both an answer and a clue — fill it in or remove the row.'; return; }
      if(a.length<2||a.length>CW_MAX_LEN){ cwProblem='Crossword ('+k+'): “'+e.answer.trim()+'” must be between 2 and '+CW_MAX_LEN+' letters.'; return; }
      if(seen.has(a)) return;
      seen.add(a); out.push({answer:a, clue});
    });
    crossword[k]=out;
  });
  if(cwProblem){ banner.style.background='#FDEBEB'; banner.textContent=cwProblem; return; }
  const dateTs = parseLessonDate(val('tfDate'));
  if(dateTs===null){
    banner.style.background='#FFF3D6';
    banner.textContent='Pick the lesson date. The lesson with the latest date is the one shown on Current Theme.';
    banner.scrollIntoView({behavior:'smooth',block:'center'}); return;
  }
  if(draftJigsawImage && !val('tfJigsawName')){ banner.style.background='#FDEBEB'; banner.textContent='Bible Jigsaw: please type the name of the character or event in the picture (children see it when they finish the puzzle), or remove the jigsaw picture.'; return; }
  const existing = editingLessonId ? getLesson(editingLessonId) : null;
  const lessonObj = {
    date: formatLessonDate(dateTs),
    image: draftImage || '',
    coloringImage: draftColoringImage || '',
    jigsawImage: draftJigsawImage || '',
    jigsawName: draftJigsawImage ? val('tfJigsawName') : '',
    mazeEnabled: val('tfMazeEnabled') !== 'no',
    crossword,
    crosswordEnabled: val('tfCwEnabled') !== 'no',
    mazeStartIcon: val('tfMazeStart') || '🐑',
    mazeGoalIcon: val('tfMazeGoalIcon') || '⛪',
    mazeGoalLabel: val('tfMazeGoalLabel') || 'the church',
    status: val('tfStatus') || 'Published',
    theme: val('tfTheme') || topic,
    topic, reference: val('tfRef'),
    bibleReading: [val('tfStoryRef')].filter(Boolean),
    story: {title: val('tfStoryTitle')||topic, reference: val('tfStoryRef'), summary},
    lessonPoints: val('tfLessonPoints').split('\n').map(s=>s.trim()).filter(Boolean),
    confession: val('tfConfession').split('\n').map(s=>s.trim()).filter(Boolean),
    memoryVerse: {text: val('tfVerseText'), reference: val('tfRef')},
    characters: teacherCharacters.map(c=>({name:(c.name||'').trim(), clue:(c.clue||'').trim()})).filter(c=>c.name),
    vocabulary: val('tfVocab').split(',').map(s=>s.trim().toUpperCase()).filter(Boolean),
    readingPlan: {'3-5': linesOf('tfReading35'), '6-9': linesOf('tfReading69'), '10-12': linesOf('tfReading1012')},
    quiz
  };
  if(existing && existing.chooseBetter) lessonObj.chooseBetter = existing.chooseBetter;
  const sizeBytes = new Blob([JSON.stringify(lessonObj)]).size;
  if(sizeBytes > MAX_LESSON_DOC_BYTES){
    banner.style.background='#FDEBEB';
    banner.textContent = 'This lesson (about '+Math.round(sizeBytes/1024)+' KB) is too large to store — please use a smaller picture.';
    return;
  }
  // Work out where this lesson will appear, so the teacher is told plainly.
  let placementNote = '';
  if(lessonObj.status !== 'Published'){
    placementNote = ' It is saved as ' + lessonObj.status + ', so children cannot see it yet.';
  } else {
    const rivals = STATE.lessons.filter(l=>l.id!==editingLessonId && lessonStatus(l)==='Published').sort(lessonNewerFirst);
    const maxSeqNow = STATE.lessons.reduce((m,l)=>Math.max(m,l.seq||0),0);
    const mine = {date:lessonObj.date, seq: existing ? (existing.seq||0) : maxSeqNow+1};
    const top = rivals[0];
    if(!top || lessonNewerFirst(mine, top) <= 0) placementNote = ' It is now the lesson on Current Theme.' + (top ? ' “'+top.topic+'” has moved to Archives.' : '');
    else placementNote = ' Its date is earlier than the current lesson (“'+top.topic+'”, '+top.date+'), so it is kept in Archives. Give it the latest date to show it on Current Theme.';
  }
  banner.style.background='#FFF3D6'; banner.textContent='Publishing…';
  const publishBtn = document.getElementById('publishBtn');
  if(publishBtn) publishBtn.disabled = true;
  try{
    if(editingLessonId){
      await updateDoc(doc(db,'lessons',editingLessonId), lessonObj);
    } else {
      const maxSeq = STATE.lessons.reduce((m,l)=>Math.max(m, l.seq||0), 0);
      await addDoc(collection(db,'lessons'), {...lessonObj, seq: maxSeq+1, createdAt: serverTimestamp()});
    }
    // Leave the editor now that the write has been accepted, so the live
    // lessons listener (which fires the moment this write lands) is free
    // to refresh the screen without wiping a form that's still open.
    teacherSection = 'lessons';
    editingLessonId = null;
    teacherCharactersInitializedFor = 'unset';
    draftImage = null;
    draftColoringImage = null;
    draftJigsawImage = null;
    const savedBits = [];
    savedBits.push(lessonObj.quiz.length + ' quiz question' + (lessonObj.quiz.length===1?'':'s'));
    savedBits.push(lessonObj.characters.length + ' "Who am I?" character' + (lessonObj.characters.length===1?'':'s'));
    const cwTotal = crossword['6-9'].length + crossword['10-12'].length;
    if(cwTotal) savedBits.push(cwTotal + ' crossword word' + (cwTotal===1?'':'s'));
    flashMessage = (lessonObj.status==='Published' ? 'Published' : 'Saved') + ' "' + lessonObj.topic + '" with ' + savedBits.join(' and ') + '.' + placementNote;
    renderTeacher();
  }catch(e){
    if(publishBtn) publishBtn.disabled = false;
    banner.style.background='#FDEBEB'; banner.textContent='Publishing did not go through. Check the connection and try again.';
  }
}

const BIBLE_BOOKS = ['Genesis','Exodus','Leviticus','Numbers','Deuteronomy','Joshua','Judges','Ruth','1 Samuel','2 Samuel','1 Kings','2 Kings',
  '1 Chronicles','2 Chronicles','Ezra','Nehemiah','Esther','Job','Psalms','Proverbs','Ecclesiastes','Song of Solomon','Isaiah','Jeremiah',
  'Lamentations','Ezekiel','Daniel','Hosea','Joel','Amos','Obadiah','Jonah','Micah','Nahum','Habakkuk','Zephaniah','Haggai','Zechariah','Malachi',
  'Matthew','Mark','Luke','John','Acts','Romans','1 Corinthians','2 Corinthians','Galatians','Ephesians','Philippians','Colossians',
  '1 Thessalonians','2 Thessalonians','1 Timothy','2 Timothy','Titus','Philemon','Hebrews','James','1 Peter','2 Peter','1 John','2 John','3 John','Jude','Revelation'];
const BOOK_ALIASES = {'psalm':'Psalms','songs of solomon':'Song of Solomon','song of songs':'Song of Solomon','revelations':'Revelation'};
function bookCanon(s){
  const t=String(s||'').trim().toLowerCase().replace(/\s+/g,' '); if(!t) return null;
  return BIBLE_BOOKS.find(b=>b.toLowerCase()===t) || BOOK_ALIASES[t] || null;
}
const BOOK_SETS = {
  pentateuch:{label:'The Law (Genesis–Deuteronomy)', ranges:[[0,5]]},
  history:{label:'History books (Joshua–Esther)', ranges:[[5,17]]},
  wisdom:{label:'Poetry and wisdom (Job–Song of Solomon)', ranges:[[17,22]]},
  major:{label:'Major prophets (Isaiah–Daniel)', ranges:[[22,27]]},
  minor:{label:'Minor prophets (Hosea–Malachi)', ranges:[[27,39]]},
  gospels:{label:'The Gospels (Matthew–John)', ranges:[[39,43]]},
  gospelsActs:{label:'The Gospels and Acts', ranges:[[39,44]]},
  paul:{label:"Paul's letters (Romans–Philemon)", ranges:[[44,57]]},
  general:{label:'General letters and Revelation (Hebrews–Revelation)', ranges:[[57,66]]},
  nt:{label:'The whole New Testament (27 books)', ranges:[[39,66]]},
  ot:{label:'The whole Old Testament (39 books)', ranges:[[0,39]]}
};
const BOOK_AUTO = {
  '3-5':{label:'The Gospels', ranges:[[39,43]]},
  '6-9':{label:'The Law and the Gospels', ranges:[[0,5],[39,43]]},
  '10-12':{label:"Paul's letters", ranges:[[44,57]]}
};
function bookSetFor(mode, age){
  const s = (mode==='auto' || !BOOK_SETS[mode]) ? (BOOK_AUTO[age]||BOOK_AUTO['6-9']) : BOOK_SETS[mode];
  return {label:s.label, books:s.ranges.flatMap(([a,b])=>BIBLE_BOOKS.slice(a,b))};
}
function chShuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function getChallenge(id){ return STATE.challenges.find(c=>c.id===id) || null; }
function publishedChallenges(){ return STATE.challenges.filter(c=>(c.status||'Published')==='Published'); }
function pickCurrentChallenge(){
  const v=publishedChallenges();
  return v.length ? v.reduce((a,b)=>((b.seq||0)>(a.seq||0)?b:a)) : null;
}
// Which games a challenge actually has content for.
function chActivities(c){
  const out=[];
  if(c.race && Array.isArray(c.race.questions) && c.race.questions.length>=3) out.push(['race','🏁 Adventure Race']);
  if(Array.isArray(c.emoji) && c.emoji.length>=1) out.push(['emoji','😀 Emoji Challenge']);
  if(c.books && c.books.mode && c.books.mode!=='off') out.push(['books','📚 Bible Book Challenge']);

/* ---- Standalone challenge scoring (never touches PROGRESS.points / scores / badges) ---- */
function recordChallengeScore(chId, type, rawScore, maxScore, countAsPlay){
  const C = PROGRESS.challenge, key = chId+':'+type;
  const prev = C.scores[key] || {score:0, max:maxScore};
  const capped = Math.max(0, Math.min(maxScore, Math.max(prev.score, rawScore)));
  C.scores[key] = {score:capped, max:maxScore};
  if(countAsPlay) C.playCounts[key] = (C.playCounts[key]||0) + 1;
  C.points = Object.values(C.scores).reduce((s,v)=>s+v.score,0);
  C.lastActive = Date.now();
  persistProgress();
  renderPointsPill();
  const a=document.getElementById('chPtsThis'); if(a) a.textContent = challengePointsFor(PROGRESS, currentChallengeId);
  const b=document.getElementById('chPtsAll'); if(b) b.textContent = C.points;
}
function challengePointsFor(prog, chId){
  const pre=chId+':', sc=(prog.challenge&&prog.challenge.scores)||{};
  return Object.keys(sc).filter(k=>k.startsWith(pre)).reduce((t,k)=>t+(Number(sc[k].score)||0),0);
}
function chBankedLine(chId, type, max){
  const b=((PROGRESS.challenge.scores[chId+':'+type])||{score:0}).score;
  return `Challenge points banked: ${b} / ${max}${b>=max?' — maxed out! 🌟':''}`;
}
function chAgainBar(onReplay){
  return `<div class="toolbar"><button class="btn" onclick="${onReplay}">Play again</button>
    <button class="btn secondary" onclick="chPickAnother()">Try another challenge game</button></div>`;
}

/* ---- 🧭 Where in the Bible? ---- */
function renderWhereChallenge(c, box){
  const pairs=(c.where||[]).map(w=>({item:w.item, book:bookCanon(w.book)})).filter(w=>w.item&&w.book);
  if(pairs.length<2){ box.innerHTML='<p>This game needs at least two items.</p>'; return; }
  const nOpt = ageKey()==='3-5' ? 3 : 4;
  const items=chShuffle(pairs).map(w=>{
    const others=[...new Set(pairs.map(x=>x.book).filter(b=>b!==w.book))];
    const ot = BIBLE_BOOKS.indexOf(w.book)<39;
    const pool=chShuffle(BIBLE_BOOKS.filter(b=>b!==w.book && !others.includes(b) && (BIBLE_BOOKS.indexOf(b)<39)===ot));
    const wrongs=chShuffle(others).concat(pool).slice(0,nOpt-1);
    return {html:`<div class="question">Where in the Bible do we find: <em>${esc(w.item)}</em>?</div>`,
      answer:w.book, options:chShuffle([w.book,...wrongs])};
  });
  chStartMCQ(c,'where','🧭 Where in the Bible?',items);

function chPickBook(name, chip){
  const B=chBk; if(!B||B.done) return;
  if(name===B.books[B.placed]){
    B.pts += B.miss===0 ? 3 : 1;
    B.placed++; B.miss=0; B.bank=B.bank.filter(b=>b!==name);
    if(B.placed===B.books.length){ B.done=true; B.msg='🎉 Perfect order — you know your Bible books!'; recordChallengeScore(B.c.id,'books',B.pts,B.max,true); }

/* ---- 🏁 Adventure Race ---- */
let chRace=null;
function raceCfg(c){
  const r=c.race||{}, L=Math.max(8,Math.min(30,parseInt(r.length)||20));
  const nums=a=>[...new Set((Array.isArray(a)?a:[]).map(n=>parseInt(n)).filter(n=>n>=2&&n<=L-1))];
  const bonus=nums(r.bonusSquares), dbl=nums(r.doubleSquares).filter(n=>!bonus.includes(n));
  const lm=(Array.isArray(r.landmarks)&&r.landmarks.length)?r.landmarks:['🌴','⛰️','🌊','🏜️','🌳'];
  return {L, N:L-1, bonus, dbl, lm, token:r.tokenIcon||'🐑', start:r.startIcon||'🏠', goal:r.goalIcon||'⛪'};
}
// Best possible run: N right answers (5 each) + 5 per double square + 10 per bonus square + 20 for finishing.
function raceMax(cfg){ return cfg.N*5 + cfg.dbl.length*5 + cfg.bonus.length*10 + 20; }
function raceDraw(deckName, src){
  const R=chRace; if(!R[deckName].length) R[deckName]=chShuffle(src);
  const q=R[deckName].pop();
  return {q:q.q, options:chShuffle(q.options), answer:q.options[q.correct]};
}
function renderRace(c, box){
  const cfg=raceCfg(c), qs=c.race.questions, bq=(c.race.bonusQuestions&&c.race.bonusQuestions.length)?c.race.bonusQuestions:qs;
  chRace={c, cfg, qs, bq, pos:0, pts:0, dbl:false, isBonus:false, note:'', deck:[], bdeck:[], q:null, max:raceMax(cfg), done:false};
  raceNext();
}
function raceCells(){
  const R=chRace, {L,N,bonus,dbl,lm,token,start,goal}=R.cfg, cols=5, rows=Math.ceil(L/cols); let out='';
  for(let r=0;r<rows;r++) for(let k=0;k<cols;k++){
    const i=r*cols+(r%2===0?k:cols-1-k);
    if(i>=L){ out+='<div class="ch-sq blank"></div>'; continue; }
    const num=i+1; let cls='', icon;
    if(i===0) icon=start; else if(i===N) icon=goal;
    else if(bonus.includes(num)){ cls='bonus'; icon='⭐'; }
    else if(dbl.includes(num)){ cls='dbl'; icon='✖2'; }
    else icon=lm[(i-1)%lm.length];
    if(i<R.pos) cls+=' passed';
    if(i===R.pos) cls+=' cur';
    out+=`<div class="ch-sq ${cls}" title="Square ${num}"><span class="ch-n">${num}</span><span class="ch-ic">${esc(icon)}</span>${i===R.pos?`<span class="ch-token">${esc(token)}</span>`:''}</div>`;
  }
  return out;
}
function raceStatus(){
  const R=chRace; return `Square ${R.pos+1} of ${R.cfg.L} · ⭐ ${R.pts} points${R.dbl?' · ✖2 on your next answer!':''}`;
}
function raceNext(){
  const R=chRace, box=document.getElementById('challengeBox'); if(!R||!box) return;
  R.q = R.isBonus ? raceDraw('bdeck',R.bq) : raceDraw('deck',R.qs);
  box.innerHTML=`<h2>🏁 Adventure Race</h2>
    <p class="muted">Answer correctly to move forward. ⭐ squares have a bonus question, ✖2 squares double your next answer. Reach ${esc(R.cfg.goal)} to finish!</p>
    <div class="ch-board">${raceCells()}</div>
    <div class="ch-status" id="chStatus">${esc(raceStatus())}</div>
    ${R.note?`<div class="banner ok">${esc(R.note)}</div>`:''}
    <div class="question">${R.isBonus?'⭐ Bonus challenge (+10): ':''}${esc(R.q.q)}</div>
    <div class="options" id="chOptions"></div><div id="chFeedback" class="feedback" role="status"></div>`;
  const wrap=document.getElementById('chOptions');
  R.q.options.forEach(o=>{ const d=document.createElement('button'); d.type='button'; d.className='option'; d.textContent=o;
    d.onclick=()=>raceAnswer(d,o); wrap.appendChild(d); });
}
function raceAnswer(btn, chosen){
  const R=chRace, q=R.q, tok=renderToken, ok=chosen===q.answer, wasBonus=R.isBonus;
  document.querySelectorAll('#chOptions .option').forEach(o=>{
    if(o.textContent===q.answer) o.classList.add('correct');
    if(o===btn && !ok) o.classList.add('wrong');
    o.onclick=null;
  });
  let msg;
  if(wasBonus){ if(ok){ R.pts+=10; msg='⭐ Bonus! +10 points'; } else msg='No bonus this time — the highlighted answer was right.'; }
  else if(ok){ const g=R.dbl?10:5; R.pts+=g; R.dbl=false; R.pos++; msg=`🎉 Correct! +${g} points — move forward!`; }
  else msg='Not quite — the highlighted answer is correct. Here comes a new question!';
  const fb=document.getElementById('chFeedback'); fb.textContent=msg; fb.style.color=ok?'#1E8A4C':'#D14343';
  recordChallengeScore(R.c.id,'race',R.pts,R.max,false);
  setTimeout(()=>{
    if(tok!==renderToken) return;
    if(wasBonus){ R.isBonus=false; R.note=''; }
    else if(ok){
      if(R.pos>=R.cfg.N){ raceFinish(); return; }
      const num=R.pos+1; R.note='';
      if(R.cfg.bonus.includes(num)){ R.isBonus=true; R.note='⭐ Bonus square! Answer this one for extra points.'; }
      else if(R.cfg.dbl.includes(num)){ R.dbl=true; R.note='✖2 square! Your next correct answer is worth double.'; }
    }
    raceNext();
  }, 1300);
}
function raceFinish(){
  const R=chRace, box=document.getElementById('challengeBox'); R.done=true; R.pts+=20;
  recordChallengeScore(R.c.id,'race',R.pts,R.max,true);
  box.innerHTML=`<h2>🏆 You reached ${esc(R.cfg.goal)}!</h2><div class="ch-board">${raceCells()}</div>
    <p>You finished the race with <strong>${R.pts}</strong> points (including a 20-point finish bonus).</p>
    <p class="muted">${chBankedLine(R.c.id,'race',R.max)}</p>${chAgainBar('chReplay()')}`;
}

const CH_MCQ_LISTS=['raceQ','raceBQ'];
function chBlankMcq(){ return {q:'',o:['','','',''],correct:0}; }
function chCloneMcq(q){ const o=(q.options||[]).slice(0,4); while(o.length<4) o.push(''); return {q:q.q||'',o,correct:Number(q.correct)||0}; }
function chInitEditor(editing){
  const r=(editing&&editing.race)||{};
  const T={
    race:{questions:(r.questions||[]).map(chCloneMcq), bonusQuestions:(r.bonusQuestions||[]).map(chCloneMcq)},
    emoji:((editing&&editing.emoji)||[]).map(e=>({emojis:e.emojis||'',answer:e.answer||'',wrong:(e.wrong||[]).join(', ')})),
    where:((editing&&editing.where)||[]).map(w=>({item:w.item||'',book:w.book||''}))
  };
  if(!T.race.questions.length) T.race.questions.push(chBlankMcq());
  if(!T.race.bonusQuestions.length) T.race.bonusQuestions.push(chBlankMcq());
  if(!T.emoji.length) T.emoji.push({emojis:'',answer:'',wrong:''});
  if(!T.where.length) T.where.push({item:'',book:''});
  teacherChallenge=T;
}
function chList(l){ const T=teacherChallenge; return {raceQ:T.race.questions, raceBQ:T.race.bonusQuestions, emoji:T.emoji, where:T.where}[l]; }
function chBlankRow(l){ return CH_MCQ_LISTS.includes(l)?chBlankMcq(): l==='emoji'?{emojis:'',answer:'',wrong:''}:{item:'',book:''}; }
function chAddRow(l){ chList(l).push(chBlankRow(l)); chRenderLists(); }
function chRemoveRow(l,i){
  const arr=chList(l); arr.splice(i,1); if(!arr.length) arr.push(chBlankRow(l));

function chOnInput(e){
  const t=e.target; if(!t.dataset||!t.dataset.l) return;
  const row=chList(t.dataset.l)[+t.dataset.i]; if(!row) return;
  const f=t.dataset.f;
  if(f==='q') row.q=t.value; else if(/^o\d$/.test(f)) row.o[+f[1]]=t.value;
  else if(f==='correct') row.correct=+t.value; else row[f]=t.value;
  chUpdateLive();
}
function chRenderLists(){

    chWhere: T.where.map((w,i)=>`<div class="ch-erow"><div class="ch-grid3">

function chCollect(){
  const T=teacherChallenge, inc={race:0,bonus:0,emoji:0,where:0};
  const mcqOut=(arr,key)=>{
    const out=[];
    arr.forEach(q=>{
      if(!((q.q||'').trim()||q.o.some(x=>(x||'').trim()))) return;
      const opts=[]; let ci=-1;
      q.o.forEach((x,k)=>{ const t=(x||'').trim(); if(t){ if(k===q.correct) ci=opts.length; opts.push(t); } });
      if(!(q.q||'').trim()||opts.length<2||ci<0||new Set(opts.map(o=>o.toLowerCase())).size!==opts.length){ inc[key]++; return; }
      out.push({q:q.q.trim(), options:opts, correct:ci});
    });
    return out;
  };
  const questions=mcqOut(T.race.questions,'race'), bonusQuestions=mcqOut(T.race.bonusQuestions,'bonus');
  const emoji=[];
  T.emoji.forEach(e=>{
    if(!((e.emojis||'').trim()||(e.answer||'').trim()||(e.wrong||'').trim())) return;
    const answer=(e.answer||'').trim(), emojis=(e.emojis||'').trim();
    const wrong=[...new Set((e.wrong||'').split(',').map(x=>x.trim()).filter(x=>x&&x.toLowerCase()!==answer.toLowerCase()))].slice(0,3);
    if(!emojis||!answer||!wrong.length){ inc.emoji++; return; }
    emoji.push({emojis, answer, wrong});
  });
  const where=[];
  T.where.forEach(w=>{
    if(!((w.item||'').trim()||(w.book||'').trim())) return;
    const book=bookCanon(w.book), item=(w.item||'').trim();
    if(!item||!book){ inc.where++; return; }
    where.push({item, book});
  });
  const nums=id=>[...new Set(val(id).split(/[^0-9]+/).filter(Boolean).map(Number))];
  const length=Math.max(8,Math.min(30,parseInt(val('chLen'))||20));
  const rawBonus=nums('chBonusSq'), rawDbl=nums('chDblSq');
  const bonusSquares=rawBonus.filter(n=>n>=2&&n<=length-1);
  const doubleSquares=rawDbl.filter(n=>n>=2&&n<=length-1&&!bonusSquares.includes(n));
  const squaresAdjusted=bonusSquares.length!==rawBonus.length||doubleSquares.length!==rawDbl.length;
  const data={
    kind:'challenge', title:val('chTitle'), weekLabel:val('chWeek'), intro:val('chIntro'), status:val('chStatus')||'Draft',
    race:{length, tokenIcon:val('chToken')||'🐑', startIcon:val('chStart')||'🏠', goalIcon:val('chGoal')||'⛪',
      landmarks:val('chLandmarks').split(/\s+/).filter(Boolean), bonusSquares, doubleSquares,
      questions, bonusQuestions},
    emoji, books:{mode:val('chBooks')||'auto'}, where
  };
  return {data, inc, squaresAdjusted};
}
function chUpdateLive(){
  const el=document.getElementById('chLive'); if(!el||!teacherChallenge) return;
  const {data,inc}=chCollect();
  const line=(ok,label,detail,bad)=>`${ok?'✅':'⬜'} <b>${label}</b> — ${detail}${bad?` <span style="color:#D14343">(${bad} incomplete row${bad===1?'':'s'} — finish or remove)</span>`:''}`;
  const rq=data.race.questions.length;
  el.innerHTML=[
    line(rq>=3,'Adventure Race',rq>=3?`${rq} questions, ${data.race.bonusQuestions.length} bonus`:`${rq} question${rq===1?'':'s'} so far — needs at least 3 to appear`,inc.race+inc.bonus),
    line(data.emoji.length>=1,'Emoji Challenge',`${data.emoji.length} puzzle${data.emoji.length===1?'':'s'}`,inc.emoji),
    line(data.books.mode!=='off','Bible Book Challenge',data.books.mode==='off'?'hidden this week':'ready (no content needed)',0),
    line(data.where.length>=2,'Where in the Bible?',data.where.length>=2?`${data.where.length} items`:`${data.where.length} item${data.where.length===1?'':'s'} so far — needs at least 2 to appear`,inc.where)
  ].join('<br>');
}

async function publishChallenge(){
  const banner=document.getElementById('chBanner'); banner.style.display='block';
  const {data,inc,squaresAdjusted}=chCollect();
  const bad=(c,t)=>{ banner.style.background='#FDEBEB'; banner.textContent=t; banner.scrollIntoView({behavior:'smooth',block:'center'}); };
  if(!data.title){ banner.style.background='#FFF3D6'; banner.textContent='Give the challenge a title.'; banner.scrollIntoView({behavior:'smooth',block:'center'}); return; }
  const parts=[]; if(inc.race) parts.push('Adventure Race questions ('+inc.race+')'); if(inc.bonus) parts.push('bonus questions ('+inc.bonus+')');
  if(inc.emoji) parts.push('Emoji puzzles ('+inc.emoji+')'); if(inc.where) parts.push('Where in the Bible? items ('+inc.where+')');
  if(parts.length){ bad(0,'Some rows are incomplete or invalid: '+parts.join(', ')+'. Every question needs text, at least two different answers and a correct answer that is filled in; emoji puzzles need emojis, an answer and a wrong option; Where in the Bible? needs an item and a real Bible book. Finish or remove those rows.'); return; }
  if(data.status==='Published' && !chActivities(data).length){ bad(0,'Add at least one complete game before publishing (or save it as a Draft).'); return; }
  const size=new Blob([JSON.stringify(data)]).size;
  if(size>MAX_LESSON_DOC_BYTES){ bad(0,'This challenge is too large to store ('+Math.round(size/1024)+' KB).'); return; }
  banner.style.background='#FFF3D6'; banner.textContent='Saving…';
  const btn=document.getElementById('chPublishBtn'); if(btn) btn.disabled=true;
  try{
    if(editingChallengeId){ await updateDoc(doc(db,'lessons',editingChallengeId), data); }
    else {
      const maxSeq=[...STATE.lessons,...STATE.challenges].reduce((m,x)=>Math.max(m,x.seq||0),0);
      await addDoc(collection(db,'lessons'), {...data, seq:maxSeq+1, createdAt:serverTimestamp()});
    }
    teacherSection='challenges'; editingChallengeId=null; challengeInitFor='unset';
    flashMessage='Saved "'+data.title+'" ('+chActivities(data).length+' game'+(chActivities(data).length===1?'':'s')+' ready, status: '+data.status+').'+(squaresAdjusted?' Some bonus/double square numbers were outside 2 to '+(data.race.length-1)+' or used twice, so they were ignored.':'');
    renderTeacher();
  }catch(e){
    if(btn) btn.disabled=false;
    banner.style.background='#FDEBEB'; banner.textContent='Saving did not go through. Check the connection and try again.';
    banner.scrollIntoView({behavior:'smooth',block:'center'});
  }
}

async function seedSampleChallenge(){
  if(!dbReady) return;
  try{
    const maxSeq=[...STATE.lessons,...STATE.challenges].reduce((m,x)=>Math.max(m,x.seq||0),0);
    await addDoc(collection(db,'lessons'), {...sampleChallenge(), seq:maxSeq+1, createdAt:serverTimestamp()});
    flashMessage='Sample challenge added as a Draft. Edit it, then set it to Published when you are ready for children to see it.'; renderTeacher();
  }catch(e){ alert('Could not add the sample. Check the connection.'); }
}
