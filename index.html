<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bible Adventure — The Covenant Nation Lekki</title>
<style>
  :root{
    --purple:#6B3FA0; --purple-dark:#4B2470; --gold:#F0B429; --gold-dark:#C98A0C;
    --green:#1E8A4C; --green-light:#E6F6EC; --cream:#FFFBF0; --paper:#FFF6E0;
    --ink:#2E2145; --muted:#6B6178; --white:#FFFFFF; --red:#D14343; --blue:#2E6FB0;
    --border:#EBD9A8;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Segoe UI',Arial,Helvetica,sans-serif;background:var(--cream);color:var(--ink)}
  button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  .app{display:flex;min-height:100vh}
  aside{width:230px;background:linear-gradient(180deg,var(--purple),var(--purple-dark));color:white;
    padding:22px 14px;position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;z-index:5}
  .logo{font-size:21px;font-weight:800;line-height:1.15;margin:0 8px 26px}
  .logo span{display:block;color:var(--gold);font-size:12px;margin-top:6px;font-weight:600}
  nav{display:flex;flex-direction:column;gap:3px}
  nav button{width:100%;border:0;background:transparent;color:white;text-align:left;
    padding:12px 13px;border-radius:12px;font-size:14.5px;cursor:pointer;display:flex;gap:10px;align-items:center;font-family:inherit}
  nav button:hover,nav button.active{background:rgba(255,255,255,.18)}
  .navicon{font-size:18px;width:20px;text-align:center}
  .sidebar-foot{margin-top:auto;font-size:11.5px;color:#D9C7F0;padding:8px;line-height:1.5}
  main{margin-left:230px;width:calc(100% - 230px);padding:26px 30px 60px;max-width:1200px}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:12px;flex-wrap:wrap}
  .pill{background:var(--green-light);color:var(--green);font-weight:700;padding:7px 13px;border-radius:30px;font-size:12.5px}
  h1{font-size:27px;margin:0 0 6px;color:var(--purple-dark)}
  h2{font-size:19px;margin:0 0 10px;color:var(--purple-dark)}
  h3{margin:0 0 6px;color:var(--purple-dark);font-size:15.5px}
  p{line-height:1.55}
  .muted{color:var(--muted);font-size:12.5px}
  .screen{display:none}.screen.active{display:block}
  .hero{background:linear-gradient(135deg,#FFF3D6,#F3E9FF);border:1px solid var(--border);border-radius:22px;
    padding:26px;display:grid;grid-template-columns:1.5fr 1fr;gap:20px;align-items:center;position:relative;overflow:hidden}
  .hero-emoji{font-size:64px;text-align:center}
  .hero-thumb{width:100%;height:150px;object-fit:cover;border-radius:16px;border:2px solid rgba(255,255,255,.7)}
  .tag{display:inline-block;padding:5px 11px;border-radius:20px;background:#F0E4FF;color:var(--purple);
    font-size:11.5px;font-weight:800;letter-spacing:.4px;margin-right:6px}
  .hero-title{font-size:30px;font-weight:900;color:var(--purple-dark);margin:8px 0 6px}
  .hero-sub{font-size:14.5px;color:var(--muted);margin-bottom:10px}
  .btn{border:0;border-radius:12px;padding:11px 18px;font-weight:800;cursor:pointer;background:var(--purple);
    color:white;font-size:14px;font-family:inherit}
  .btn:hover{background:var(--purple-dark)}
  .btn.secondary{background:white;color:var(--purple);border:1.5px solid #D8C4EE}
  .btn.green{background:var(--green)}
  .btn.gold{background:var(--gold);color:var(--purple-dark)}
  .btn.danger{background:#fff;color:var(--red);border:1.5px solid #F3C2C2}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .grid{display:grid;gap:14px;margin-top:16px}
  .grid4{grid-template-columns:repeat(4,1fr)}
  .grid3{grid-template-columns:repeat(3,1fr)}
  .grid2{grid-template-columns:repeat(2,1fr)}
  .card{background:white;border:1px solid var(--border);border-radius:16px;padding:17px;box-shadow:0 2px 10px rgba(60,30,90,.05)}
  .stat{font-size:25px;font-weight:900;color:var(--purple)}
  .icon{font-size:26px;margin-bottom:6px}
  .progress{height:9px;background:#F0E9DA;border-radius:20px;overflow:hidden;margin:8px 0}
  .progress>div{height:100%;background:var(--gold)}
  .lesson-card{background:white;border:1px solid var(--border);border-radius:18px;padding:20px}
  .smallcard{padding:14px;border-radius:14px;background:var(--paper);border:1px solid var(--border)}
  .week-card{background:white;border:1px solid var(--border);border-radius:16px;padding:16px;cursor:pointer;transition:.15s;text-align:left;font-family:inherit;width:100%}
  .week-card:hover{border-color:var(--purple);box-shadow:0 3px 12px rgba(107,63,160,.12)}
  .week-card .wk-tag{font-size:11px;color:var(--gold-dark);font-weight:800;letter-spacing:.4px}
  .week-thumb{width:100%;height:96px;object-fit:cover;border-radius:12px;margin-bottom:10px;border:1px solid var(--border)}
  .lesson-banner{position:relative;border-radius:20px;overflow:hidden;margin-bottom:16px;min-height:210px;
    display:flex;align-items:flex-end;background:linear-gradient(135deg,#FFF3D6,#F3E9FF)}
  .lesson-banner .banner-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .lesson-banner .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(46,33,69,.15) 0%,rgba(46,33,69,.55) 55%,rgba(46,33,69,.85) 100%)}
  .lesson-banner .banner-text{position:relative;padding:22px;color:#fff;max-width:760px}
  .lesson-banner .banner-text h2{color:#fff;font-size:26px;margin:6px 0 4px;text-shadow:0 2px 12px rgba(0,0,0,.45)}
  .lesson-banner .banner-text p{margin:0;color:#F3E9FF;font-size:14px;text-shadow:0 1px 8px rgba(0,0,0,.5)}
  .lesson-banner .tag{background:rgba(255,255,255,.92)}
  .lesson-banner.no-image{min-height:0}
  .lesson-banner.no-image .scrim{background:none}
  .lesson-banner.no-image .banner-text{color:var(--ink)}
  .lesson-banner.no-image .banner-text h2{color:var(--purple-dark);text-shadow:none}
  .lesson-banner.no-image .banner-text p{color:var(--muted);text-shadow:none}
  .activity-wrap{position:relative;border-radius:18px;overflow:hidden;padding:2px}
  .activity-bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.10;pointer-events:none;filter:saturate(.85)}
  .activity-wrap>*:not(.activity-bg){position:relative}
  .activity-box{min-height:280px;background:rgba(255,255,255,.93);backdrop-filter:blur(1px)}
  .activity-nav{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
  .activity-nav button{border:1.5px solid #D8C4EE;background:white;color:var(--purple);border-radius:11px;
    padding:9px 13px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
  .activity-nav button.active,.activity-nav button:hover{background:var(--purple);color:white;border-color:var(--purple)}
  .question{font-size:19px;font-weight:800;margin:10px 0 16px;color:var(--purple-dark)}
  .options{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
  .option{padding:14px;background:var(--paper);border:2px solid var(--border);border-radius:13px;cursor:pointer;
    font-weight:700;font-size:14px;font-family:inherit;text-align:left;width:100%;color:var(--ink)}
  .option:hover{border-color:var(--purple);background:#F3E9FF}
  .option.correct{background:var(--green-light);border-color:var(--green);color:var(--green)}
  .option.wrong{background:#FDEBEB;border-color:var(--red);color:var(--red)}
  .feedback{margin-top:14px;font-weight:800;min-height:22px;font-size:14.5px}
  .grid-scroll{overflow-x:auto;padding-bottom:6px}
  .word-grid{display:grid;gap:3px;justify-content:center;margin:16px auto;user-select:none;width:max-content}
  .letter{border:1px solid #E5D9BC;border-radius:6px;display:flex;align-items:center;justify-content:center;
    font-weight:800;background:#fff;cursor:pointer;font-size:13.5px;font-family:inherit;padding:0}
  .letter.sel{background:#F0E4FF;border-color:var(--purple)}
  .letter.found{background:var(--green-light);border-color:var(--green);color:var(--green)}
  .wordlist{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .wordlist span{padding:5px 11px;border-radius:20px;background:var(--paper);border:1px solid var(--border);font-size:12.5px;font-weight:700}
  .wordlist span.done{background:var(--green-light);color:var(--green);border-color:var(--green);text-decoration:line-through}
  .verse-bank{display:flex;flex-wrap:wrap;gap:9px;margin:14px 0;min-height:46px;padding:10px;background:var(--paper);border-radius:12px;border:1px dashed var(--border)}
  .verse-answer{display:flex;flex-wrap:wrap;gap:9px;min-height:46px;padding:10px;background:#fff;border:2px solid var(--border);border-radius:12px;margin-bottom:10px}
  .vchip{padding:8px 13px;background:white;border:1.5px solid #D8C4EE;border-radius:9px;cursor:pointer;font-weight:700;font-size:13.5px;font-family:inherit}
  .vchip:hover{background:#F3E9FF}
  table{width:100%;border-collapse:collapse;background:white;border-radius:14px;overflow:hidden;font-size:13px}
  th,td{padding:10px 11px;border-bottom:1px solid #F0E9DA;text-align:left}
  th{background:var(--paper);color:var(--purple-dark)}
  .table-scroll{overflow-x:auto}
  .input,textarea.input,select.input{padding:10px;border:1.5px solid #D8C4EE;border-radius:9px;width:100%;font-family:inherit;font-size:13.5px;background:#fff}
  textarea.input{resize:vertical}
  label.field{display:block;font-size:12.5px;font-weight:700;color:var(--purple-dark);margin:10px 0 4px}
  .badge{width:118px;text-align:center;padding:14px 8px;border-radius:16px;background:#FFF6DB;border:1px solid #F0D27B}
  .badge.locked{opacity:.4}
  .badge .big{font-size:34px}
  .badge-row{display:flex;gap:13px;flex-wrap:wrap}
  .banner{padding:12px 16px;border-radius:12px;font-weight:700;font-size:13.5px;margin-bottom:14px}
  .banner.warn{background:#FFF3D6;color:#8A5A00;border:1px solid #F0D27B}
  .banner.ok{background:var(--green-light);color:var(--green);border:1px solid #B7E3C6}
  .banner.bad{background:#FDEBEB;color:#A32B2B;border:1px solid #F3C2C2}
  .toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:12px 0}
  .character-clue{background:var(--paper);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:14px}
  .treasure-row{display:flex;align-items:center;gap:14px;background:white;border:1px solid var(--border);border-radius:14px;padding:12px 16px;margin-bottom:10px}
  .treasure-choice{flex:1;padding:11px;border-radius:11px;border:2px solid var(--border);cursor:pointer;text-align:center;font-weight:700;font-size:13.5px;font-family:inherit;background:#fff;color:var(--ink)}
  .treasure-choice:hover{border-color:var(--purple)}
  .treasure-choice.correct{background:var(--green-light);border-color:var(--green);color:var(--green)}
  .treasure-choice.wrong{background:#FDEBEB;border-color:var(--red);color:var(--red)}
  .footer-note{margin-top:16px;color:var(--muted);font-size:12px;line-height:1.6}
  .modal-overlay{position:fixed;inset:0;background:rgba(46,33,69,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
  .modal-overlay.hidden{display:none}
  .modal-card{background:var(--cream);border-radius:22px;padding:30px;max-width:480px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.25);max-height:88vh;overflow:auto}
  .modal-card h2{font-size:23px;margin-bottom:4px}
  .age-options{display:flex;flex-direction:column;gap:10px;margin:16px 0}
  .age-btn{display:flex;align-items:center;gap:12px;padding:13px 15px;border-radius:14px;border:2px solid var(--border);background:white;cursor:pointer;text-align:left;font-family:inherit;width:100%}
  .age-btn:hover{border-color:var(--purple)}
  .age-btn.selected{border-color:var(--purple);background:#F3E9FF}
  .age-btn .ab-emoji{font-size:26px}
  .age-btn .ab-label{font-weight:800;color:var(--purple-dark);font-size:14.5px}
  .age-btn .ab-range{font-size:12px;color:var(--muted)}
  .profile-row{display:flex;gap:8px;align-items:center}
  .profile-row .age-btn{flex:1}
  .mini-btn{border:1.5px solid #D8C4EE;background:#fff;border-radius:10px;padding:9px 10px;cursor:pointer;font-family:inherit;font-size:13px}
  .profile-chip{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);border-radius:12px;padding:9px 11px;margin-bottom:14px;cursor:pointer;font-size:12.5px;border:0;color:#fff;font-family:inherit;width:100%;text-align:left}
  .profile-chip:hover{background:rgba(255,255,255,.22)}
  .profile-chip .pc-emoji{font-size:20px}
  .sheep-count{font-size:30px;letter-spacing:4px;line-height:1.5;background:var(--paper);border:1px solid var(--border);border-radius:14px;padding:16px;text-align:center;margin:14px 0}
  .reflect-box{width:100%;min-height:90px;padding:12px;border:1.5px solid #D8C4EE;border-radius:11px;font-family:inherit;font-size:13.5px}
  .teacher-nav{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px;padding:8px;background:white;border:1px solid var(--border);border-radius:16px;position:sticky;top:8px;z-index:5;box-shadow:0 5px 18px rgba(46,33,69,.06)}
  .teacher-nav button{border:0;background:transparent;padding:10px 13px;border-radius:11px;font-family:inherit;font-weight:800;color:var(--purple-dark);cursor:pointer}
  .teacher-nav button.selected,.teacher-nav button:hover{background:#F3E9FF;color:var(--purple)}
  .teacher-nav .spacer{flex:1}
  .teacher-hero{display:flex;justify-content:space-between;align-items:center;gap:20px;background:linear-gradient(135deg,#FFF8E8,#F4ECFF);border:1px solid var(--border);border-radius:22px;padding:24px;margin-bottom:18px}
  .teacher-hero h1{margin:2px 0 6px}.teacher-hero p{margin:0;color:var(--muted)}.teacher-hero-icon{font-size:58px}
  .section-head{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;margin-bottom:15px}
  .section-head h1,.section-head h2{margin:0 0 4px}
  .action-card{min-height:155px}.action-card p{color:var(--muted);min-height:42px}
  .status{display:inline-block;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:900}
  .status-live{background:#E6F6EC;color:#187A3D}.status-review{background:#FFF3D6;color:#8A5A00}.status-draft{background:#F0E9F8;color:#6D4AA5}
  .img-drop{border:2px dashed #D8C4EE;border-radius:16px;padding:18px;text-align:center;background:#FCF9FF}
  .img-preview{width:100%;max-height:230px;object-fit:cover;border-radius:14px;border:1px solid var(--border)}
  .img-meta{font-size:12px;color:var(--muted);margin-top:8px}
  .login-wrap{max-width:420px;margin:40px auto;text-align:center}
  .login-card{background:white;border:1px solid var(--border);border-radius:22px;padding:30px;box-shadow:0 8px 30px rgba(60,30,90,.08);text-align:left}
  .login-card h1{text-align:center}
  .pin-input{font-size:28px;letter-spacing:14px;text-align:center;padding:12px;width:100%;border:2px solid #D8C4EE;border-radius:14px;font-family:inherit;background:#fff}
  .pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}
  .pinpad button{padding:15px 0;font-size:19px;font-weight:800;border:1.5px solid #D8C4EE;background:#fff;border-radius:13px;cursor:pointer;font-family:inherit;color:var(--purple-dark)}
  .pinpad button:hover{background:#F3E9FF}
  .config-banner{max-width:640px;margin:40px auto;text-align:left}
  @media(max-width:880px){
    aside{width:64px;padding:16px 8px}.logo{font-size:0;text-align:center}.logo:before{content:"🐑";font-size:24px}
    .logo span{display:none}nav button{font-size:0;justify-content:center;padding:12px 6px}
    .navlabel{display:none}.sidebar-foot{display:none}
    .profile-chip{justify-content:center;padding:9px 4px}.profile-chip span:not(.pc-emoji){display:none}
    main{margin-left:64px;width:calc(100% - 64px);padding:16px}
    .hero{grid-template-columns:1fr}.grid4{grid-template-columns:repeat(2,1fr)}
    .grid3{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}.options{grid-template-columns:1fr}
    .lesson-banner .banner-text h2{font-size:21px}
  }
  @media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="configScreen" class="config-banner" style="display:none"></div>
<div id="profileModal" class="modal-overlay hidden"><div class="modal-card" id="profileModalInner"></div></div>
<div class="app" id="appRoot" style="display:none">
  <aside>
    <div class="logo">🌟 BIBLE ADVENTURE<span>The Covenant Nation Lekki</span></div>
    <button class="profile-chip" id="profileChip" onclick="openProfileModal()"><span class="pc-emoji">🐑</span><span id="profileChipText">Set up profile</span></button>
    <nav id="mainNav">
      <button class="active" data-screen="home" onclick="go('home',this)"><span class="navicon">🏠</span><span class="navlabel">Home</span></button>
      <button data-screen="lesson" onclick="go('lesson',this)"><span class="navicon">📖</span><span class="navlabel">This Week</span></button>
      <button data-screen="activity" onclick="go('activity',this)"><span class="navicon">🎮</span><span class="navlabel">Activities</span></button>
      <button data-screen="badges" onclick="go('badges',this)"><span class="navicon">🏆</span><span class="navlabel">My Badges</span></button>
      <button data-screen="teacher" onclick="go('teacher',this)"><span class="navicon">🧑‍🏫</span><span class="navlabel">Teacher</span></button>
    </nav>
    <div class="sidebar-foot" id="sidebarFoot">Learn it. Play it. Remember it. Live it.</div>
  </aside>
  <main>
    <div class="topbar">
      <div><strong>Sunday School Digital Companion</strong><div class="muted" id="topbarSub">Weekly interactive Bible learning</div></div>
      <div style="display:flex;gap:10px;align-items:center">
        <span class="pill" id="syncPill" style="background:#F0E9F8;color:#6D4AA5">🔄 Connecting…</span>
        <span class="pill" id="pointsPill">⭐ 0 Adventure Points</span>
      </div>
    </div>
    <section id="home" class="screen active"></section>
    <section id="lesson" class="screen"></section>
    <section id="activity" class="screen"></section>
    <section id="badges" class="screen"></section>
    <section id="teacher" class="screen"></section>
  </main>
</div>

<script type="module">
/* =====================================================================
   FIREBASE SETUP — paste your project's config below.
   Firebase console → Project settings → General → Your apps → Web app.
   See SETUP.md for the full step-by-step guide (free tier is enough
   for a Sunday School's worth of children).
   ===================================================================== */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import {
  getFirestore, doc, getDoc, getDocs, setDoc, addDoc, updateDoc, deleteDoc,
  collection, onSnapshot, query, orderBy, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
import {
  getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut,
  EmailAuthProvider, reauthenticateWithCredential, updatePassword
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

let db=null, auth=null, dbReady=false;
const isPlaceholder = !firebaseConfig.apiKey || firebaseConfig.apiKey.startsWith('YOUR_');
if(!isPlaceholder){
  try{
    const fbApp = initializeApp(firebaseConfig);
    db = getFirestore(fbApp);
    auth = getAuth(fbApp);
    dbReady = true;
  }catch(e){ console.error('Firebase init failed', e); }
}
if(!dbReady){
  document.getElementById('configScreen').style.display='block';
  document.getElementById('configScreen').innerHTML = `
    <div class="login-card">
      <h1>⚙️ Firebase not configured yet</h1>
      <p>This copy of Bible Adventure hasn't been connected to a Firebase project, so it can't
      share lessons or children's progress across devices yet.</p>
      <p class="muted">Open this file, find the <code>firebaseConfig</code> object near the top of the
      script, and paste in your project's web app config. Full steps are in <code>SETUP.md</code>,
      which was delivered alongside this file.</p>
    </div>`;
} else {
  document.getElementById('appRoot').style.display='flex';
}

/* Expose the functions the inline onclick="" handlers in the HTML call. */
const api = {};
window.addEventListener('DOMContentLoaded', ()=>{ boot(); });

/* ===================== CONSTANTS ===================== */
const AGE_GROUPS = {
  '3-5':  {label:'Little Lambs', range:'Ages 3–5',  emoji:'🐣'},
  '6-9':  {label:'Explorers',    range:'Ages 6–9',  emoji:'🐑'},
  '10-12':{label:'Voyagers',     range:'Ages 10–12',emoji:'🦁'}
};
const BLANK_PROGRESS = {completed:{}, scores:{}, playCounts:{}, points:0, whoAmICorrect:0, lastActive:null};
const MAX_LESSON_DOC_BYTES = 900000; // stay safely under Firestore's 1 MiB document limit

/* ===================== STATE ===================== */
let STATE = { lessons: [] };
let PROFILES = [];
let currentLessonId = null;
let currentActivity = 'quiz';
let renderToken = 0;
let teacherUnlocked = false;
let teacherEmail = '';
let PROGRESS = normalizeProgress({});
let activeProfileId = null;
try{ activeProfileId = localStorage.getItem('bibleAdventureActiveId') || null; }catch(e){}

function normalizeProgress(p){
  const out = Object.assign({}, BLANK_PROGRESS, p||{});
  out.completed = out.completed || {};
  out.scores = out.scores || {};
  out.playCounts = out.playCounts || {};
  out.points = Number(out.points)||0;
  return out;
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
async function sha256(text){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
function setSyncPill(state){
  const el = document.getElementById('syncPill'); if(!el) return;
  if(state==='ok'){ el.textContent='☁️ Synced'; el.style.background='#E6F6EC'; el.style.color='#1E8A4C'; }
  else if(state==='offline'){ el.textContent='⚠️ Offline — saved on this device'; el.style.background='#FFF3D6'; el.style.color='#8A5A00'; }
  else { el.textContent='🔄 Connecting…'; el.style.background='#F0E9F8'; el.style.color='#6D4AA5'; }
}

/* ===================== FIRESTORE: LESSONS (live) ===================== */
function watchLessons(){
  if(!dbReady) return;
  const q = query(collection(db,'lessons'), orderBy('seq'));
  onSnapshot(q, snap=>{
    STATE.lessons = snap.docs.map(d=>({id:d.id, ...d.data()}));
    setSyncPill('ok');
    if(!currentLessonId || !STATE.lessons.some(l=>l.id===currentLessonId)){
      const pick = pickCurrentLesson();
      currentLessonId = pick ? pick.id : null;
    }
    // Never force-refresh an open lesson editor: a background lesson update
    // (including the teacher's own in-flight publish) would otherwise wipe
    // out characters, quiz JSON and other fields the teacher hasn't saved yet.
    if(isEditingLessonScreen()) return;
    refreshCurrentScreen();
  }, err=>{ console.error(err); setSyncPill('offline'); });
}
function isEditingLessonScreen(){
  const teacherScreen = document.getElementById('teacher');
  return !!(teacherScreen && teacherScreen.classList.contains('active') && teacherSection==='editor');
}
function getLesson(id){ return STATE.lessons.find(l=>l.id===id) || STATE.lessons[0] || null; }
function parseLessonDate(s){ const t = Date.parse(String(s||'').replace(/^[A-Za-z]+,\s*/,'')); return isNaN(t)?null:t; }
function pickCurrentLesson(){
  if(!STATE.lessons.length) return null;
  const live = STATE.lessons.filter(l=>(l.status||'Published')==='Published');
  const pool = live.length ? live : STATE.lessons;
  const now = Date.now();
  let best = pool[0], bestGap = Infinity;
  pool.forEach(l=>{ const t=parseLessonDate(l.date); if(t===null) return; const gap=Math.abs(now-t); if(gap<bestGap){bestGap=gap; best=l;} });
  return best;
}
function lessonImage(l){ return (l && typeof l.image==='string' && l.image.startsWith('data:image')) ? l.image : ''; }

/* ===================== FIRESTORE: PROFILES (shared class roster, live) ===================== */
function watchProfiles(){
  if(!dbReady) return;
  onSnapshot(collection(db,'profiles'), snap=>{
    PROFILES = snap.docs.map(d=>({id:d.id, ...d.data()})).sort((a,b)=>(a.name||'').localeCompare(b.name||''));
    renderProfileChip();
    if(document.getElementById('profileModal') && !document.getElementById('profileModal').classList.contains('hidden')) renderProfileModal();
    // Same rule as the lessons listener: never force-redraw an open lesson
    // editor just because a child somewhere added or changed a profile.
    if(isEditingLessonScreen()) return;
    if(document.getElementById('teacher').classList.contains('active')) renderTeacher();
  }, err=>console.error(err));
}
function getActiveProfile(){ return PROFILES.find(p=>p.id===activeProfileId) || null; }
function ageLabel(){ const p=getActiveProfile(); return p ? AGE_GROUPS[p.ageGroup].range : AGE_GROUPS['6-9'].range; }
function ageKey(){ const p=getActiveProfile(); return p ? p.ageGroup : '6-9'; }

/* ===================== PROGRESS (per child, synced to Firestore, cached locally as an offline fallback) ===================== */
function loadLocalProgressCache(id){ try{ return JSON.parse(localStorage.getItem('bibleAdventureProgress_'+id)||'{}'); }catch(e){ return {}; } }
function saveLocalProgressCache(id,p){ try{ localStorage.setItem('bibleAdventureProgress_'+id, JSON.stringify(p)); }catch(e){} }
async function persistProgress(){
  if(!activeProfileId) return;
  saveLocalProgressCache(activeProfileId, PROGRESS);
  if(!dbReady){ setSyncPill('offline'); return; }
  try{ await setDoc(doc(db,'progress',activeProfileId), PROGRESS, {merge:true}); setSyncPill('ok'); }
  catch(e){ console.error(e); setSyncPill('offline'); }
}
async function loadProgressForActiveProfile(){
  if(!activeProfileId){ PROGRESS = normalizeProgress({}); return; }
  if(dbReady){
    try{
      const snap = await getDoc(doc(db,'progress',activeProfileId));
      PROGRESS = normalizeProgress(snap.exists() ? snap.data() : loadLocalProgressCache(activeProfileId));
      setSyncPill('ok');
      return;
    }catch(e){ console.error(e); setSyncPill('offline'); }
  }
  PROGRESS = normalizeProgress(loadLocalProgressCache(activeProfileId));
}
function recordActivityScore(lessonId, type, rawScore, maxScore, countAsPlay){
  const key = lessonId+':'+type;
  const prev = PROGRESS.scores[key] || {score:0, max:maxScore};
  const capped = Math.max(0, Math.min(maxScore, Math.max(prev.score, rawScore)));
  PROGRESS.scores[key] = {score:capped, max:maxScore};
  if(countAsPlay) PROGRESS.playCounts[key] = (PROGRESS.playCounts[key]||0) + 1;
  markCompleted(lessonId, type);
  PROGRESS.points = Object.values(PROGRESS.scores).reduce((s,v)=>s+v.score,0);
  PROGRESS.lastActive = Date.now();
  persistProgress();
  renderPointsPill();
}
function totalPlays(){ return Object.values(PROGRESS.playCounts).reduce((s,v)=>s+v,0); }
function markCompleted(lessonId, activityType){
  PROGRESS.completed[lessonId] = PROGRESS.completed[lessonId] || {};
  PROGRESS.completed[lessonId][activityType] = true;
  PROGRESS.lastActive = Date.now();
}
function renderPointsPill(){ document.getElementById('pointsPill').textContent = '⭐ ' + (PROGRESS.points||0) + ' Adventure Points'; }

let profileModalMode = 'pick'; // 'pick' | 'form' | 'pin'

let pinTargetId = null, childPinBuffer = '', childPinError = '';

function openProfileModal(){

  renderProfileModal();

}
function backToPicker(){ profileModalMode = PROFILES.length===0 ? 'form' : 'pick'; renderProfileModal(); }
function closeProfileModal(){ document.getElementById('profileModal').classList.add('hidden'); }
function renderAgeOptions(){
  const wrap = document.getElementById('ageOptions'); if(!wrap) return;
  wrap.innerHTML = Object.entries(AGE_GROUPS).map(([k,v])=>`
    <button type="button" class="age-btn ${pendingAge===k?'selected':''}" onclick="pickPendingAge('${k}')">

}
function pickPendingAge(k){ pendingAge=k; renderAgeOptions(); }

/* Tapping a name in the picker no longer opens it directly — a child with a
   PIN set must enter it first, so other children can't wander into their page. */
function attemptOpenProfile(id){
  const p = PROFILES.find(x=>x.id===id); if(!p) return;
  if(!p.pinHash){ chooseProfile(id); return; }
  pinTargetId = id; childPinBuffer=''; childPinError='';
  profileModalMode = 'pin';
  renderProfileModal();
}
function childPinPress(d){
  if(childPinBuffer.length>=4) return;
  childPinBuffer += d; childPinError='';
  renderProfileModal();
  if(childPinBuffer.length===4) childPinSubmit();
}
function childPinClear(){ childPinBuffer=''; childPinError=''; renderProfileModal(); }
function pinBackToPicker(){ profileModalMode='pick'; childPinBuffer=''; childPinError=''; pinTargetId=null; renderProfileModal(); }
async function childPinSubmit(){
  const p = PROFILES.find(x=>x.id===pinTargetId);
  if(!p){ pinBackToPicker(); return; }
  const hash = await sha256(childPinBuffer);
  if(hash === p.pinHash){
    profileModalMode='pick'; pinTargetId=null;
    await chooseProfile(p.id);
  } else {
    childPinBuffer=''; childPinError='That PIN is not right. Try again, or ask a teacher for help.';
    renderProfileModal();
  }
}

      <label class="field">Pick your age group</label>
      <div class="age-options" id="ageOptions"></div>
      <label class="field">${existing ? 'Change PIN (optional)' : 'Set a 4-digit PIN (optional)'}</label>
      <input class="input" id="profilePinInput" type="password" inputmode="numeric" maxlength="4" placeholder="4 digits, e.g. 1234" autocomplete="off">
      <input class="input" id="profilePinConfirm" type="password" inputmode="numeric" maxlength="4" placeholder="Type it again" autocomplete="off" style="margin-top:6px">

async function removeProfile(id){
  const p = PROFILES.find(x=>x.id===id);
  if(!confirm('Remove '+((p&&p.name)||'this profile')+' and their progress? This cannot be undone.')) return;
  try{
    if(dbReady){ await deleteDoc(doc(db,'profiles',id)); await deleteDoc(doc(db,'progress',id)).catch(()=>{}); }
  }catch(e){ alert('Could not remove this profile online. Check the connection and try again.'); return; }
  try{ localStorage.removeItem('bibleAdventureProgress_'+id); }catch(e){}
  if(activeProfileId===id){ activeProfileId=null; try{localStorage.removeItem('bibleAdventureActiveId');}catch(e){} PROGRESS=normalizeProgress({}); renderProfileChip(); renderPointsPill(); }
  renderProfileModal(); refreshCurrentScreen();
}
async function resetChildPin(id){
  const p = PROFILES.find(x=>x.id===id); if(!p) return;
  const wantsNew = confirm('Set a new PIN for '+(p.name||'this child')+'? Click Cancel instead to remove their PIN (no PIN required to open their page).');
  try{
    if(wantsNew){
      const newPin = prompt('Enter a new 4-digit PIN for '+(p.name||'this child')+':');
      if(newPin===null) return;
      if(!/^\d{4}$/.test(newPin)){ alert('The PIN must be exactly 4 digits.'); return; }
      await updateDoc(doc(db,'profiles',id), {pinHash: await sha256(newPin)});
      alert('PIN updated.');
    } else {
      await updateDoc(doc(db,'profiles',id), {pinHash: null});
      alert('PIN removed — '+(p.name||'this child')+' can open their page without a PIN now.');
    }
  }catch(e){ alert('Could not update the PIN online. Check the connection and try again.'); }
}
async function chooseProfile(id){
  activeProfileId = id;
  try{ localStorage.setItem('bibleAdventureActiveId', id); }catch(e){}
  await loadProgressForActiveProfile();
  closeProfileModal(); renderProfileChip(); renderPointsPill(); refreshCurrentScreen();
}
async function saveProfileAndStart(){
  const name = document.getElementById('profileNameInput').value.trim().slice(0,30);
  if(!name){ alert('Please enter a name.'); return; }
  if(!dbReady){ alert('Firebase is not configured yet — see SETUP.md.'); return; }
  const pin1 = (document.getElementById('profilePinInput').value||'').trim();
  const pin2 = (document.getElementById('profilePinConfirm').value||'').trim();
  let pinHashValue; // undefined = leave unchanged (edit only); null = no PIN; string = new hash
  if(pin1 || pin2){
    if(!/^\d{4}$/.test(pin1)){ alert('The PIN must be exactly 4 digits.'); return; }
    if(pin1!==pin2){ alert('The two PINs do not match.'); return; }
    pinHashValue = await sha256(pin1);
  } else if(!editingProfileId){
    pinHashValue = null;
  }
  try{
    if(editingProfileId){
      const patch = {name, ageGroup: pendingAge};
      if(pinHashValue !== undefined) patch.pinHash = pinHashValue;
      await updateDoc(doc(db,'profiles',editingProfileId), patch);
    } else {
      const ref = await addDoc(collection(db,'profiles'), {name, ageGroup: pendingAge, pinHash: pinHashValue, createdAt: serverTimestamp()});
      activeProfileId = ref.id;
      try{ localStorage.setItem('bibleAdventureActiveId', ref.id); }catch(e){}
      PROGRESS = normalizeProgress({});
      await persistProgress();
    }
  }catch(e){ alert('Could not save this profile online. Check the connection and try again.'); return; }
  closeProfileModal(); renderProfileChip(); renderPointsPill(); refreshCurrentScreen();
}
function renderProfileChip(){

  chipText.textContent = p ? ((p.name||'(no name)') + ' · ' + g.label) : "Who's playing?";
  document.querySelector('#profileChip .pc-emoji').textContent = g.emoji;

function refreshCurrentScreen(){
  const active = document.querySelector('.screen.active');
  if(!active) return;
  go(active.id, document.querySelector('#mainNav button[data-screen="'+active.id+'"]'));
}

/* ===================== NAV ===================== */
function go(id, btn){
  renderToken++;
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelectorAll('#mainNav button').forEach(b=>b.classList.remove('active'));
  const target = btn || document.querySelector('#mainNav button[data-screen="'+id+'"]');
  if(target) target.classList.add('active');
  if(id==='home') renderHome();
  if(id==='lesson') renderLessonScreen();
  if(id==='activity') renderActivityScreen();
  if(id==='badges') renderBadges();
  if(id==='teacher') renderTeacherGate();
  window.scrollTo({top:0, behavior:'instant'});
}
function openLesson(id){ currentLessonId=id; go('lesson'); }
function openLessonActivities(id){ currentLessonId=id; currentActivity='quiz'; go('activity'); }

function progressPct(lessonId){
  const done = PROGRESS.completed[lessonId] || {};
  const n = Object.keys(done).filter(k=>['quiz','wordsearch','unscramble','memory'].includes(k)).length;
  return Math.round(Math.min(n,4)/4*100);
}

function renderActivityScreen(){
  const el = document.getElementById('activity');
  if(!STATE.lessons.length){ el.innerHTML = `<div class="banner warn">No lessons yet.</div>`; return; }
  if(!currentLessonId) currentLessonId = pickCurrentLesson().id;
  const l = getLesson(currentLessonId);
  const types = [['quiz','🧠 Bible quiz'],['wordsearch','🔤 Word search'],['unscramble','🔀 Unscramble'],['memory','📜 Memory verse'],['whoami','🔎 Who am I?']];
  if(l.chooseBetter) types.push(['choose','💎 Choose the treasure']);
  if(ageKey()==='3-5') types.splice(1,0,['count','🔢 Counting fun']);
  if(ageKey()==='10-12') types.push(['deeper','🧭 Deeper dive']);
  if(!types.some(t=>t[0]===currentActivity)) currentActivity='quiz';
  const img = lessonImage(l);
  el.innerHTML = `
    <h1>Activity centre — ${esc(l.topic)} <span class="tag" style="vertical-align:middle">${AGE_GROUPS[ageKey()].emoji} ${esc(AGE_GROUPS[ageKey()].label)}</span></h1>
    <div class="activity-nav">${types.map(([k,label])=>`<button class="${currentActivity===k?'active':''}" onclick="setActivity('${k}')">${label}</button>`).join('')}</div>
    <div class="activity-wrap">
      ${img?`<div class="activity-bg" style="background-image:url('${img}')"></div>`:''}
      <div id="activityBox" class="card activity-box"></div>
    </div>`;
  renderActivityContent();
}

/* ---- Word search ---- */
let wsWords=[], wsFound=new Set(), wsSelecting=null, wsWordPoolLen=0;
function buildWordSearch(words, size, dirs){
  const grid = Array.from({length:size},()=>Array(size).fill(''));
  const placed = [];
  words.forEach(word=>{
    let ok=false, tries=0;
    while(!ok && tries<300){
      tries++;
      const dir = dirs[Math.floor(Math.random()*dirs.length)];
      const rLo = dir[0]<0?word.length-1:0, rHi = dir[0]>0?size-word.length:size-1;
      const cLo = dir[1]<0?word.length-1:0, cHi = dir[1]>0?size-word.length:size-1;
      if(rHi<rLo||cHi<cLo) continue;
      const r0 = rLo+Math.floor(Math.random()*(rHi-rLo+1)), c0 = cLo+Math.floor(Math.random()*(cHi-cLo+1));
      let fits=true;
      for(let i=0;i<word.length;i++){ const r=r0+dir[0]*i,c=c0+dir[1]*i;
        if(r<0||c<0||r>=size||c>=size){fits=false;break;} if(grid[r][c]&&grid[r][c]!==word[i]){fits=false;break;} }
      if(fits){ for(let i=0;i<word.length;i++) grid[r0+dir[0]*i][c0+dir[1]*i]=word[i]; placed.push({word,r0,c0,dir}); ok=true; }
    }
  });
  const letters='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  for(let r=0;r<size;r++) for(let c=0;c<size;c++) if(!grid[r][c]) grid[r][c]=letters[Math.floor(Math.random()*26)];
  return {grid, placed};
}
function renderWordSearch(l, box){
  const age = ageKey(); let size, wordPool, dirs, cell;
  if(age==='3-5'){ size=6; wordPool=l.vocabulary.filter(w=>w.length<=5).slice(0,3); dirs=[[0,1],[1,0]]; cell=42; }
  else if(age==='10-12'){ size=13; wordPool=l.vocabulary.filter(w=>w.length<=13); dirs=[[0,1],[1,0],[1,1],[0,-1],[-1,0],[-1,-1]]; cell=30; }
  else { size=10; wordPool=l.vocabulary.filter(w=>w.length<=10); dirs=[[0,1],[1,0],[1,1]]; cell=34; }
  if(!wordPool.length) wordPool = l.vocabulary.slice(0,3).map(w=>w.slice(0,size));
  const built = buildWordSearch(wordPool, size, dirs);
  wsWords = built.placed; const listed = built.placed.map(p=>p.word); wsWordPoolLen = listed.length;
  wsFound = new Set(); wsSelecting=null;
  box.innerHTML = `<h2>🔤 Word search</h2><p class="muted">Tap the first letter of a word, then tap its last letter.</p>
    <div class="grid-scroll"><div class="word-grid" id="wsGridEl" style="grid-template-columns:repeat(${size},${cell}px)"></div></div>
    <div class="wordlist" id="wsWordlist">${listed.map(w=>`<span id="wsw-${w}">${esc(w)}</span>`).join('')}</div>
    <div id="wsFeedback" class="feedback" role="status"></div><div id="wsDone"></div>`;
  const gridEl = document.getElementById('wsGridEl');
  for(let r=0;r<size;r++) for(let c=0;c<size;c++){
    const d=document.createElement('button'); d.type='button'; d.className='letter'; d.style.width=cell+'px'; d.style.height=cell+'px';
    d.textContent=built.grid[r][c]; d.dataset.r=r; d.dataset.c=c; d.onclick=()=>wsClick(r,c); gridEl.appendChild(d);
  }
}
function wsClick(r,c){
  if(!wsSelecting){ wsSelecting={r,c}; markSel(r,c,true); return; }
  const start = wsSelecting; wsSelecting=null; markSel(start.r,start.c,false);
  let matched=null;
  wsWords.forEach(p=>{
    if(wsFound.has(p.word)) return;
    const endR=p.r0+p.dir[0]*(p.word.length-1), endC=p.c0+p.dir[1]*(p.word.length-1);
    if((start.r===p.r0&&start.c===p.c0&&r===endR&&c===endC)||(r===p.r0&&c===p.c0&&start.r===endR&&start.c===endC)) matched=p;
  });
  const fb=document.getElementById('wsFeedback');
  if(!matched){ fb.textContent='Not a word yet — try another pair of letters.'; fb.style.color='#6B6178'; return; }
  wsFound.add(matched.word);
  for(let i=0;i<matched.word.length;i++){ const cellEl=document.querySelector(`.letter[data-r="${matched.r0+matched.dir[0]*i}"][data-c="${matched.c0+matched.dir[1]*i}"]`); if(cellEl) cellEl.classList.add('found'); }
  const chip=document.getElementById('wsw-'+matched.word); if(chip) chip.classList.add('done');
  const maxScore=wsWordPoolLen*5+15, allFound=wsFound.size===wsWordPoolLen;
  recordActivityScore(currentLessonId,'wordsearch', wsFound.size*5+(allFound?15:0), maxScore, allFound);
  if(allFound){ fb.textContent='🎉 All words found!'; fb.style.color='#1E8A4C';
    document.getElementById('wsDone').innerHTML=`<p class="muted">${bankedLine(currentLessonId,'wordsearch',maxScore)}</p>${againBar(`renderWordSearch(getLesson('${currentLessonId}'),document.getElementById('activityBox'))`)}`;
  } else { fb.textContent='Nice find! Keep going.'; fb.style.color='#1E8A4C'; }
}
function markSel(r,c,on){ const cell=document.querySelector(`.letter[data-r="${r}"][data-c="${c}"]`); if(cell) cell.classList.toggle('sel',on); }

/* ---- Unscramble ---- */
let uWordIndex=0, uWords=[];
function shuffleWord(w){ let arr=w.split(''),tries=0; do{ arr.sort(()=>Math.random()-0.5); tries++; }while(arr.join('')===w && tries<10); return arr.join(' '); }
function renderUnscramble(l, box){
  const age=ageKey();
  if(age==='3-5'){ uWords=l.vocabulary.filter(w=>w.length<=5).slice(0,3); if(!uWords.length) uWords=l.vocabulary.slice(0,3); }
  else if(age==='10-12'){ uWords=l.vocabulary.slice(); } else { uWords=l.vocabulary.slice(0,6); }
  uWordIndex=0; showUnscrambleWord(box);
}
function showUnscrambleWord(box){
  if(uWordIndex>=uWords.length){
    const maxScore=uWords.length*10;
    recordActivityScore(currentLessonId,'unscramble', maxScore, maxScore, true);
    box.innerHTML=`<h2>🎉 Unscramble complete</h2><p>You unscrambled all the Bible words for this week.</p>
      <p class="muted">${bankedLine(currentLessonId,'unscramble',maxScore)}</p>${againBar(`renderUnscramble(getLesson('${currentLessonId}'),document.getElementById('activityBox'))`)}`;
    return;
  }
  const word=uWords[uWordIndex];
  const hint = ageKey()==='3-5' ? `<p class="muted">Hint: it starts with “${esc(word[0])}”</p>` : '';
  box.innerHTML=`<h2>🔀 Unscramble the Bible word</h2><p class="muted">Word ${uWordIndex+1} of ${uWords.length}</p>
    <div class="question" style="letter-spacing:4px">${esc(shuffleWord(word))}</div>${hint}
    <input id="uAns" class="input" placeholder="Type your answer" style="max-width:300px" autocomplete="off" onkeydown="if(event.key==='Enter')checkUnscramble('${word}')">
    <div class="toolbar"><button class="btn" onclick="checkUnscramble('${word}')">Check answer</button></div>
    <div id="uFeedback" class="feedback" role="status"></div>`;
  document.getElementById('uAns').focus();
}
function checkUnscramble(word){
  const token=renderToken;
  const v=(document.getElementById('uAns').value||'').trim().toUpperCase();
  const fb=document.getElementById('uFeedback');
  if(v===word){ fb.textContent='🎉 Correct!'; fb.style.color='#1E8A4C'; uWordIndex++;
    setTimeout(()=>{ if(token!==renderToken) return; showUnscrambleWord(document.getElementById('activityBox')); }, 900);

function relativeTime(ts){
  const t = ts && ts.toMillis ? ts.toMillis() : ts;
  if(!t) return 'Never';
  const mins=Math.floor((Date.now()-t)/60000);
  if(mins<1) return 'Just now'; if(mins<60) return mins+' min ago';
  const hrs=Math.floor(mins/60); if(hrs<24) return hrs+' hr'+(hrs===1?'':'s')+' ago';
  const days=Math.floor(hrs/24); if(days<30) return days+' day'+(days===1?'':'s')+' ago';
  return new Date(t).toLocaleDateString();
}

function kb(dataUri){ return Math.round((dataUri.length*3/4)/1024); }
function handleImageFile(input){
  const file = input.files && input.files[0]; if(!file) return;
  const note = document.getElementById('imgNote');
  if(!/^image\//.test(file.type)){ note.textContent='That file is not an image. Choose a JPG, PNG or WebP.'; return; }
  note.textContent='Preparing image…';
  const reader = new FileReader();
  reader.onload = e=>{
    const img = new Image();
    img.onload = ()=>{
      const MAX=1200; const scale=Math.min(1, MAX/img.width);
      const canvas=document.createElement('canvas'); canvas.width=Math.round(img.width*scale); canvas.height=Math.round(img.height*scale);
      const ctx=canvas.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,canvas.width,canvas.height); ctx.drawImage(img,0,0,canvas.width,canvas.height);
      let out=canvas.toDataURL('image/jpeg',0.7);
      if(kb(out)>350) out=canvas.toDataURL('image/jpeg',0.5);
      if(kb(out)>350) out=canvas.toDataURL('image/jpeg',0.35);
      draftImage=out; renderImageField();
    };
    img.onerror=()=>{ note.textContent='That image could not be read. Try a different file.'; };
    img.src=e.target.result;
  };
  reader.onerror=()=>{ note.textContent='That image could not be read. Try a different file.'; };
  reader.readAsDataURL(file);
}

function val(id){ const el=document.getElementById(id); return el?el.value.trim():''; }
async function publishLesson(){
  const banner=document.getElementById('teacherBanner');
  const topic=val('tfTopic'), summary=val('tfSummary');
  banner.style.display='block';
  if(!topic||!summary){ banner.style.background='#FFF3D6'; banner.textContent='Add at least the topic and the Bible story summary.'; return; }
  let quiz=[]; const quizRaw=val('tfQuiz');
  if(quizRaw){ try{ quiz=JSON.parse(quizRaw); }catch(e){ banner.style.background='#FDEBEB'; banner.textContent='The quiz JSON has a typo. Fix it, or clear the box to publish without a quiz.'; return; } }
  const existing = editingLessonId ? getLesson(editingLessonId) : null;
  const lessonObj = {
    date: val('tfDate') || 'Untitled week',
    image: draftImage || '',
    status: val('tfStatus') || 'Published',
    theme: val('tfTheme') || topic,
    topic, reference: val('tfRef'),
    bibleReading: [val('tfStoryRef')].filter(Boolean),
    story: {title: val('tfStoryTitle')||topic, reference: val('tfStoryRef'), summary},
    lessonPoints: val('tfLessonPoints').split('\n').map(s=>s.trim()).filter(Boolean),
    confession: val('tfConfession').split('\n').map(s=>s.trim()).filter(Boolean),
    memoryVerse: {text: val('tfVerseText'), reference: val('tfRef')},
    characters: teacherCharacters.map(c=>({name:(c.name||'').trim(), clue:(c.clue||'').trim()})).filter(c=>c.name),
    vocabulary: val('tfVocab').split(',').map(s=>s.trim().toUpperCase()).filter(Boolean),
    quiz
  };
  if(existing && existing.chooseBetter) lessonObj.chooseBetter = existing.chooseBetter;
  const sizeBytes = new Blob([JSON.stringify(lessonObj)]).size;
  if(sizeBytes > MAX_LESSON_DOC_BYTES){
    banner.style.background='#FDEBEB';
    banner.textContent = 'This lesson (about '+Math.round(sizeBytes/1024)+' KB) is too large to store — please use a smaller picture.';
    return;
  }
  banner.style.background='#FFF3D6'; banner.textContent='Publishing…';
  const publishBtn = document.getElementById('publishBtn');
  if(publishBtn) publishBtn.disabled = true;
  try{
    if(editingLessonId){
      await updateDoc(doc(db,'lessons',editingLessonId), lessonObj);
    } else {
      const maxSeq = STATE.lessons.reduce((m,l)=>Math.max(m, l.seq||0), 0);
      await addDoc(collection(db,'lessons'), {...lessonObj, seq: maxSeq+1, createdAt: serverTimestamp()});
    }
    // Leave the editor now that the write has been accepted, so the live
    // lessons listener (which fires the moment this write lands) is free
    // to refresh the screen without wiping a form that's still open.
    teacherSection = 'lessons';
    editingLessonId = null;
    teacherCharactersInitializedFor = 'unset';
    draftImage = null;
    const savedBits = [];
    savedBits.push(lessonObj.quiz.length + ' quiz question' + (lessonObj.quiz.length===1?'':'s'));
    savedBits.push(lessonObj.characters.length + ' "Who am I?" character' + (lessonObj.characters.length===1?'':'s'));
    flashMessage = 'Published "' + lessonObj.topic + '" with ' + savedBits.join(' and ') + '.';
    renderTeacher();
  }catch(e){
    if(publishBtn) publishBtn.disabled = false;
    banner.style.background='#FDEBEB'; banner.textContent='Publishing did not go through. Check the connection and try again.';
  }
}
